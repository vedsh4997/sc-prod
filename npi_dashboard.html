<title>New Product Introduction</title>

<style>
:root{
 --bg:#f7f6ef;--surface:#fff;--surface-2:#f1efe4;--border:#e0dccb;
 --text-1:#1c1b16;--text-2:#5c5a4d;--text-3:#9b9a8a;
 --good:#1a7f37;--warn:#9a6a00;--bad:#b3261e;--accent:#14b8a6;--bg-0:#fff;
 --p1:#2563eb;--p2:#ea580c;--p3:#7c3aed;--p4:#0f766e;--p5:#be185d;
 --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif}

 --bg:#0e1b2a;--surface:#16293d;--surface-2:#1e3a54;--border:#27405a;
 --text-1:#e8eef6;--text-2:#9fb3c6;--text-3:#6d8094;
 --good:#3dd68c;--warn:#f5a623;--bad:#ef6461;--accent:#2dd4bf;--bg-0:#0e1b2a;
 --p1:#4a90e8;--p2:#e06c0a;--p3:#8f6ae8;--p4:#2dd4bf;--p5:#f472b6}}
[data-theme="dark"]{
 --bg:#0e1b2a;--surface:#16293d;--surface-2:#1e3a54;--border:#27405a;
 --text-1:#e8eef6;--text-2:#9fb3c6;--text-3:#6d8094;
 --good:#3dd68c;--warn:#f5a623;--bad:#ef6461;--accent:#2dd4bf;--bg-0:#0e1b2a;
 --p1:#4a90e8;--p2:#e06c0a;--p3:#8f6ae8;--p4:#2dd4bf;--p5:#f472b6}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text-1);font-family:var(--sans);
 padding:22px clamp(14px,3vw,30px) 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(19px,2.3vw,25px);font-weight:700;margin:3px 0 3px;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:12.5px}
.thm{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
 border:1px solid var(--border);background:var(--surface);color:var(--text-2);
 border-radius:7px;padding:6px 11px;cursor:pointer}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.jump a{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:7px;
 border:1px solid var(--border);background:var(--surface);color:var(--text-2);text-decoration:none;
 display:inline-flex;align-items:center;gap:6px}
.jump a:hover{border-color:var(--accent);color:var(--accent)}
.jump i{width:9px;height:9px;border-radius:3px;display:inline-block}
.unres{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:9px;
 margin-bottom:16px;background:var(--surface-2);border-left:4px solid var(--bad);font-size:12.5px;line-height:1.55}
.unres code{font-family:var(--mono);font-size:11.5px;background:var(--surface);
 border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.tile-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.tile-v{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1;margin-top:5px;letter-spacing:-.02em}
.tile-s{font-size:11px;color:var(--text-2);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
 padding:15px 17px 17px;margin-bottom:14px}
.card-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.card-t{font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-s{font-size:11.5px;color:var(--text-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:9px 0 2px;
 font-family:var(--mono);font-size:10.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.psec{background:var(--surface);border:1px solid var(--border);border-radius:14px;
 padding:0;margin-bottom:16px;overflow:hidden}
.pbar{height:4px}
.pin{padding:14px 17px 17px}
.phd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.pdot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.pnm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.ptest{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-left:auto}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:12px}
.pkc{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.pkv{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.15}
.pkl{font-family:var(--mono);font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:15px;align-items:start}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.colh{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
 color:var(--text-3);margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 10px;border-radius:7px;
 border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer}
.chip.on{background:var(--accent);border-color:transparent;color:var(--bg-0)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.dl{font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 11px;border-radius:7px;
 border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.dl.solid{background:var(--accent);color:var(--bg-0)}
.tbl-w{overflow:auto;max-height:340px;border:1px solid var(--border);border-radius:9px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-3);font-size:8.5px;
 letter-spacing:.07em;text-transform:uppercase;z-index:1}
td.num,th.num{text-align:right}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.rt{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.hstrip{display:flex;gap:9px;overflow-x:auto;padding:3px 2px 9px;scrollbar-width:thin}
.hc{flex:0 0 132px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
 padding:9px 11px 10px;cursor:pointer;transition:.12s;position:relative}
.hc:hover{border-color:var(--text-3);transform:translateY(-1px)}
.hc.on{border-color:var(--text-1);box-shadow:0 0 0 1px var(--text-1) inset}
.hc-h{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.06em}
.hc-live{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:8.5px;
 font-weight:700;color:var(--good);letter-spacing:.09em}
.hc-y{font-family:var(--mono);font-size:19px;font-weight:700;margin:3px 0 7px;letter-spacing:-.01em}
.hc-r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
 color:var(--text-3);line-height:1.55}
.hc-r b{color:var(--text-2);font-weight:600}
.hc-r.f b{color:var(--bad)}
.hc-nd{margin-top:5px;font-family:var(--mono);font-size:8.5px;color:var(--warn)}
.hrp{margin-top:10px;border:1px solid var(--border);border-radius:11px;padding:11px 13px;background:var(--bg)}
.hrh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.hrt{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.hrp table{width:100%}
.hrp tr.vit td{font-weight:700}
.hrp tr.vit td:first-child{border-left:3px solid var(--bad);padding-left:6px}
.empty{padding:22px 14px;text-align:center;color:var(--text-3);font-size:12px}
.tipw{position:fixed;pointer-events:none;z-index:60;opacity:0;transition:opacity .1s}
.tip{background:var(--surface);border:1px solid var(--border);border-radius:8px;
 padding:7px 10px;font-family:var(--mono);font-size:10.5px;line-height:1.55;
 box-shadow:0 8px 24px rgba(0,0,0,.18);white-space:nowrap}
.foot{color:var(--text-3);font-family:var(--mono);font-size:10px;text-align:center;margin-top:24px}

     +'<td>'+(x.outcome==='PASS'?'<span class="pill ok">PASS</span>'
        :x.outcome==='RETEST'?'<span class="pill rt">RETEST</span>':'<span class="pill no">NEVER PASSED</span>')+'</td>'
     +'<td style="color:var(--text-2)">'+esc(x.step||'\u2014')+'</td></tr>').join('')
   +'</tbody></table></div>'
  :'<div class="empty" style="padding:12px">No serial-level detail for this hour.</div>';
 const ndNote=nd?'<div class="colh" style="margin-top:7px;color:var(--warn)">'
   +nd+' of '+row.units+' unit(s) came from '+esc(co.join(', ')||'a counts-only tester')
   +', which reports IN / PASS / FAIL only \u2014 no serial, no reason'
   +(ndf?' ('+ndf+' of them failed)':'')+'</div>':'';
 panel.innerHTML='<div class="hrp"><div class="hrh"><span class="hrt">'+esc(prod)+' \u00b7 '+hl(h)
  +'</span><span class="card-s">'+row.units+' in \u00b7 '+row.pass+' pass \u00b7 '+row.fail
  +' fail \u00b7 '+(row.fpy==null?'\u2014':row.fpy.toFixed(1)+'%')+'</span>'
  +'<button class="dl" style="margin-left:auto" onclick="pickHour(\''+esc(prod)+'\','+h+')">close</button></div>'
  +'<div class="g2"><div><div class="colh">Why it failed</div>'+reasons+ndNote+'</div>'
  +'<div><div class="colh">Serial numbers this hour</div>'+sTbl+'</div></div></div>';
}
function yCol(v,floor){return v==null?'var(--text-3)':(v<floor?'var(--bad)':(v<97?'var(--warn)':'var(--good)'));}
function drawProductHours(p,box){
 if(p.hours_source==='none'){
  box.innerHTML='<div class="empty">'+p.units.toLocaleString()+' unit(s) today, but no hourly detail.'
   +'<br>Hourly comes from the <b>HPR</b> exports \u2014 one file per hour. None of them carry this '
   +'product\u2019s testers for this day.<br>Check the Daily_HPR folder, or set <code>HPR_INPUT_DIR</code>.</div>';
  return;
 }
 const d=p.hours_delta||0;
 const note=d?'<div class="colh" style="margin-top:6px;color:var(--warn)">hourly totals '
   +Math.abs(d).toLocaleString()+' unit(s) '+(d>0?'more':'fewer')+' than the day figure \u2014 '
   +'hourly is the HPR, the day is the '+esc(p.source||'DPR')+'; separate exports</div>':'';
 const floor=D.ramp_floor||90;
 const last=(p.hours||[]).length?p.hours[p.hours.length-1].h:null;
 const cards=(p.hours||[]).map(r=>{
  const on=(OPEN_H[p.product]===r.h);
  return '<div class="hc'+(on?' on':'')+'" data-h="'+r.h+'">'
   +'<div class="hc-h">'+String(r.h).padStart(2,'0')+'h</div>'
   +(r.h===last?'<div class="hc-live">LIVE</div>':'')
   +'<div class="hc-y" style="color:'+yCol(r.fpy,floor)+'">'
   +(r.fpy==null?'\u2014':r.fpy.toFixed(1)+'%')+'</div>'
   +'<div class="hc-r"><span>IN</span><b>'+r.units+'</b></div>'
   +'<div class="hc-r"><span>PASS</span><b>'+r.pass+'</b></div>'
   +'<div class="hc-r f"><span>FAIL</span><b>'+r.fail+'</b></div>'
   +(r.no_detail?'<div class="hc-nd">'+r.no_detail+' counts-only</div>':'')
   +'</div>';}).join('');
 box.innerHTML='<div class="hstrip">'+cards+'</div>'
  +'<div class="colh" style="margin-top:2px">click an hour for its serials and failure reasons '
  +'\u00b7 source '+esc(p.hours_from||'HPR')+'</div>'+note;
 box.querySelectorAll('.hc').forEach(el=>{
  el.addEventListener('click',()=>pickHour(p.product,parseInt(el.dataset.h,10)));});
}
function wireOn(root){root.querySelectorAll('.bar').forEach(el=>{
 el.addEventListener('mouseenter',e=>tipOn(e,decodeURIComponent(el.dataset.tip)));
 el.addEventListener('mousemove',tipMove);el.addEventListener('mouseleave',tipOff);});}
function wire(sel){document.querySelectorAll(sel).forEach(el=>{
 el.addEventListener('mouseenter',e=>tipOn(e,decodeURIComponent(el.dataset.tip)));
 el.addEventListener('mousemove',tipMove);el.addEventListener('mouseleave',tipOff);});}

/* ---------- bar chart: units per hour, failures stacked on top ---------- */
function hourChart(rows,colour,label,W,H,clickKey){
 const by={};AX.forEach(h=>by[h]={units:0,pass:0,fail:0});
 (rows||[]).forEach(r=>{if(by[r.h]){by[r.h].units+=r.units;by[r.h].pass+=r.pass;by[r.h].fail+=r.fail;}});
 const max=Math.max(1,...AX.map(h=>by[h].units));
 const ML=42,MR=12,MT=26,MB=34,pw=W-ML-MR,ph=H-MT-MB;
 const slot=pw/Math.max(1,AX.length),bw=Math.min(44,slot*0.62),y=v=>MT+ph-(v/max)*ph;
 let g='';
 for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);
  g+='<line x1="'+ML+'" y1="'+yy+'" x2="'+(W-MR)+'" y2="'+yy+'" stroke="var(--border)"/>'
   +'<text x="'+(ML-7)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+Math.round(v)+'</text>';}
 AX.forEach((h,i)=>{
  const d=by[h],cx=ML+slot*i+slot/2;
  const every=AX.length>12?2:1;
  if(i%every===0)g+='<text x="'+cx+'" y="'+(MT+ph+14)+'" text-anchor="middle" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+hl(h)+'</text>';
  if(!d.units)return;
  const fpy=100*d.pass/d.units;
  const yTop=y(d.units),yPass=y(d.pass),hPass=MT+ph-yPass,hFail=yPass-yTop;
  const tip=encodeURIComponent('<b>'+label+' &middot; '+hl(h)+'</b><br>'+d.units+' tested<br>'
   +'<span style="color:var(--good)">&#9632;</span> '+d.pass+' passed first time<br>'
   +'<span style="color:var(--bad)">&#9632;</span> '+d.fail+' failed first time<br>first pass '+fpy.toFixed(1)+'%');
  const sel=(clickKey&&OPEN_H[clickKey]===h);
  g+='<g class="bar" data-tip="'+tip+'" data-h="'+h+'"'
   +(clickKey?' data-click="1" style="cursor:pointer"':'')+'>'
   +'<rect x="'+(cx-bw/2)+'" y="'+yPass+'" width="'+bw+'" height="'+Math.max(0,hPass)+'" fill="'+colour+'" opacity=".88"/>'
   +(d.fail?'<rect x="'+(cx-bw/2)+'" y="'+yTop+'" width="'+bw+'" height="'+Math.max(1,hFail-2)+'" rx="4" fill="var(--bad)" opacity=".92"/>':'')
   +(sel?'<rect x="'+(cx-bw/2-2)+'" y="'+(yTop-2)+'" width="'+(bw+4)+'" height="'+(MT+ph-yTop+4)+'" rx="5" fill="none" stroke="var(--text-1)" stroke-width="1.8"/>':'')
   +'<rect x="'+(cx-bw/2)+'" y="'+MT+'" width="'+bw+'" height="'+ph+'" fill="transparent"/></g>'
   +'<text x="'+cx+'" y="'+(yTop-6)+'" text-anchor="middle" font-size="9" font-weight="700" font-family="var(--mono)" fill="'
   +(fpy<(D.ramp_floor||90)?'var(--bad)':'var(--text-2)')+'">'+fpy.toFixed(0)+'%</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>';
}

function tiles(){
 let u=0,f=0;PRODS.forEach(p=>{u+=p.units;f+=p.fails;});
 const un=T.unresolved;
 if(un){u+=un.units;}
 const by={};AX.forEach(h=>by[h]=0);
 PRODS.forEach(p=>(p.hours||[]).forEach(r=>{if(by[r.h]!=null)by[r.h]+=r.units;}));
 const busiest=AX.slice().sort((a,b)=>by[b]-by[a])[0];
 const fpy=u?100*(u-f)/u:null;
 const dd=s=>String(s||'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
 document.getElementById('sub').innerHTML=
  (T.day_mismatch
    ? 'hourly <b>'+esc(dd(T.hpr_day))+'</b> (HPR) &middot; daily <b>'+esc(dd(T.day))+'</b> ('+esc(T.source||'DPR')+')'
    : esc(dd(T.day))+' &middot; source '+esc(T.source||'DPR'))
  +' &middot; <b>'+u.toLocaleString()+'</b> units across <b>'+PRODS.length+'</b> product'
  +(PRODS.length===1?'':'s')+' &middot; generated '+esc(D.generated||'');
 const el=[['Tested today',u.toLocaleString(),AX.length+' hours · '+PRODS.length+' products',''],
  ['Passed first time',(u-f).toLocaleString(),(fpy==null?'—':fpy.toFixed(2)+'% first pass'),'var(--good)'],
  ['Failed first time',f.toLocaleString(),'across every NPI tester','var(--bad)'],
  ['Busiest hour',busiest==null?'—':hl(busiest),(busiest==null?'':by[busiest]+' units'),'']];
 document.getElementById('tiles').innerHTML=el.map(a=>
  '<div class="tile"><div class="tile-l">'+a[0]+'</div><div class="tile-v"'
  +(a[3]?' style="color:'+a[3]+'"':'')+'>'+a[1]+'</div><div class="tile-s">'+a[2]+'</div></div>').join('');
 document.getElementById('jump').innerHTML=PRODS.map(p=>
  '<a href="#p_'+encodeURIComponent(p.product)+'"><i style="background:'+COL(p.product)+'"></i>'
  +esc(p.product)+' '+p.units.toLocaleString()+'</a>').join('');
 document.getElementById('foot').textContent=
  'build '+(D.build||'')+' · first attempt per serial · golden samples excluded';
}

function dayNote(){
 const el=document.getElementById('daynote'); if(!el) return;
 if(!T.day_mismatch){el.style.display='none';return;}
 const dd=s=>String(s||'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
 el.style.display='';
 el.innerHTML='<div><b>The two halves of this page are different days.</b><br>'
  +'The hourly cards are <b>'+esc(dd(T.hpr_day))+'</b>, the newest production day in the HPR exports '
  +'(one file per hour, so this is the shift in progress). The tiles and the day totals are <b>'
  +esc(dd(T.day))+'</b>, the newest '+esc(T.source||'DPR')+' export \u2014 that one lands once the day '
  +'is over. This is normal mid-shift; it closes once today\u2019s '+esc(T.source||'DPR')+' arrives.</div>';
}
function unres(){
 const u=T.unresolved,el=document.getElementById('unres');
 if(!u||!u.units){el.style.display='none';return;}
 el.style.display='';
 el.innerHTML='<div><b>'+u.units+' unit(s) on '+esc(u.testers.join(', '))
  +' are not attributed to a product.</b><br>That tester runs '+esc(u.products.join(' and '))
  +', so the Model Number decides which &mdash; and no rule is set yet. These units are counted in the '
  +'totals above and left out of the product sections below. Run <code>python npi_dashboard.py --models</code>'
  +' and fill in <code>SHARED_TESTER_MODEL</code> in npi_core.py; this banner then disappears.</div>';
}

/* ---------- one full section per product ---------- */
function sections(){
 if(!PRODS.length){document.getElementById('sections').innerHTML=
   '<div class="card"><div class="empty">No NPI tester produced units today.<br>'
   +'Run <code>python npi_dashboard.py --diag</code> to see what the exports contain.</div></div>';return;}
 document.getElementById('sections').innerHTML=PRODS.map(p=>{
  const c=COL(p.product),fl=D.ramp_floor||90;
  const h=HIST[p.product];
  const k=[['Tested',p.units.toLocaleString(),''],
   ['First pass',(p.fpy==null?'—':p.fpy.toFixed(2)+'%'),(p.fpy!=null&&p.fpy<fl?'var(--bad)':'var(--good)')],
   ['Failed first time',String(p.fails),(p.fails?'var(--bad)':'')],
   ['Testers',String((p.testers||[]).length),''],
   ['In window',h?h.att.toLocaleString():'—','']];
  const tes=(p.testers||[]).map(t=>'<tr><td>'+esc(t.station)+'</td><td class="num">'+t.units
   +'</td><td class="num" style="color:'+(t.fails?'var(--bad)':'var(--text-3)')+'">'+t.fails
   +'</td><td class="num"><b>'+(t.fpy==null?'—':t.fpy.toFixed(1)+'%')+'</b></td>'
   +'<td>'+esc(t.first_ts||'')+(t.last_ts?' – '+esc(t.last_ts):'')+'</td></tr>').join('');
  const par=(p.pareto||[]).length?(p.pareto||[]).slice(0,10).map(s=>
    '<tr><td>'+esc(s.step||'—')+'</td><td class="num">'+s.n+'</td><td class="num">'+s.pct
    +'%</td><td class="num" style="color:var(--warn)">'+s.cum+'%</td></tr>').join('')
   :'<tr><td colspan="4" style="color:var(--text-3)">Nothing failed first time.</td></tr>';
  return '<div class="psec" id="p_'+encodeURIComponent(p.product)+'">'
   +'<div class="pbar" style="background:'+c+'"></div><div class="pin">'
   +'<div class="phd"><span class="pdot" style="background:'+c+'"></span>'
   +'<span class="pnm">'+esc(p.product)+'</span>'
   +'<span class="ptest">'+esc((p.expected||[]).join(' · '))+'</span></div>'
   +'<div class="pk">'+k.map(a=>'<div class="pkc"><div class="pkv"'
     +(a[2]?' style="color:'+a[2]+'"':'')+'>'+a[1]+'</div><div class="pkl">'+a[0]+'</div></div>').join('')+'</div>'
   +'<div class="colh">Hour by hour</div><div class="ch" data-p="'+esc(p.product)+'"></div>'
   +'<div id="hr_'+esc(p.product)+'"></div>'
   +'<div class="g2" style="margin-top:14px">'
     +'<div><div class="colh">Testers</div><div class="tbl-w"><table><thead><tr><th>Tester</th>'
       +'<th class="num">Units</th><th class="num">Fails</th><th class="num">FPY</th><th>Window</th></tr></thead>'
       +'<tbody>'+tes+'</tbody></table></div></div>'
     +'<div><div class="colh">Failing steps</div><div class="tbl-w"><table><thead><tr><th>Step</th>'
       +'<th class="num">n</th><th class="num">%</th><th class="num">Cum</th></tr></thead><tbody>'+par+'</tbody></table></div></div>'
   +'</div>'
   +'<div class="card-h" style="margin-top:16px"><span class="colh" style="margin:0">Serial numbers</span>'
     +'<span class="card-s" id="ss_'+esc(p.product)+'"></span>'
     +'<span class="acts"><button class="dl" onclick="dl(\''+esc(p.product)+'\')">&#8681; CSV</button>'
     +'<button class="dl solid" onclick="dl(\'ALL\')">&#8681; All products</button></span></div>'
   +'<div class="chips" id="sf_'+esc(p.product)+'"></div>'
   +'<div class="tbl-w"><table id="st_'+esc(p.product)+'"></table></div>'
   +'</div></div>';
 }).join('');
 PRODS.forEach(p=>{
  const box=document.querySelector('.ch[data-p="'+CSS.escape(p.product)+'"]');
  if(box){drawProductHours(p,box);renderHour(p.product);}
  snChips(p.product);snTable(p.product);});
 wire('.bar');
}

/* ---------- serials ---------- */
function snRows(prod){
 const p=PRODS.find(x=>x.product===prod);if(!p)return [];
 const f=FS[prod]||'all';
 return (p.serials||[]).filter(s=>f==='all'
   ||(f==='fail'&&s.status==='FAIL')||(f==='retest'&&s.outcome==='RETEST')
   ||(f==='scrap'&&s.outcome==='FAIL')||(f==='pass'&&s.outcome==='PASS'));
}
function snChips(prod){
 const p=PRODS.find(x=>x.product===prod);if(!p)return;
 const S=p.serials||[],n=k=>S.filter(k).length,f=FS[prod]||'all';
 const defs=[['all','All',S.length],['fail','Failed first time',n(s=>s.status==='FAIL')],
  ['retest','Passed on retest',n(s=>s.outcome==='RETEST')],
  ['scrap','Never passed',n(s=>s.outcome==='FAIL')],
  ['pass','Passed first time',n(s=>s.outcome==='PASS')]];
 document.getElementById('sf_'+prod).innerHTML=defs.map(d=>
  '<button class="chip '+(f===d[0]?'on':'')+'" onclick="setF(\''+prod+'\',\''+d[0]+'\')">'
  +d[1]+' <b>'+d[2]+'</b></button>').join('');
}
function setF(prod,k){FS[prod]=k;snChips(prod);snTable(prod);}
function snTable(prod){
 const rows=snRows(prod),p=PRODS.find(x=>x.product===prod);
 document.getElementById('ss_'+prod).textContent=
  rows.length.toLocaleString()+' of '+((p.serials||[]).length).toLocaleString()
  +' shown · last 4 digits only · the CSV carries the full serial';
 const body=rows.slice(0,500).map((s,i)=>{
  const pill=s.outcome==='PASS'?'<span class="pill ok">PASS</span>'
   :s.outcome==='RETEST'?'<span class="pill rt">RETEST</span>':'<span class="pill no">NEVER PASSED</span>';
  return '<tr><td class="num" style="color:var(--text-3)">'+(i+1)+'</td><td>'+esc(mask(s.sn))+'</td>'
   +'<td>'+esc(s.tester||'')+'</td><td>'+esc(s.ts||'')+'</td>'
   +'<td>'+(s.status==='FAIL'?'<span class="pill no">FAIL</span>':'<span class="pill ok">PASS</span>')+'</td>'
   +'<td>'+pill+'</td><td class="num">'+(s.attempts||1)+'</td>'
   +'<td style="color:var(--text-2)">'+esc(s.step||'—')+'</td></tr>';}).join('');
 document.getElementById('st_'+prod).innerHTML=
  '<thead><tr><th></th><th>Serial &middot; last 4</th><th>Tester</th><th>Time</th>'
  +'<th>First try</th><th>Outcome</th><th class="num">Tries</th><th>First failing step</th></tr></thead>'
  +'<tbody>'+body+'</tbody>';
}
let SAVER=null;
if(window.claude&&claude.use)claude.use('downloads').then(d=>{SAVER=d;}).catch(()=>{});
async function dl(which){
 const head=['Serial Number','Product','Tester','Time','First Try','Outcome','Attempts','First Failing Step'];
 let out=[],name='';
 if(which==='ALL'){
  PRODS.forEach(p=>(p.serials||[]).forEach(s=>out.push([s.sn,p.product,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step])));
  const u=T.unresolved;
  if(u){const up=(T.products||[]).find(x=>x.product===u.label);
   (up&&up.serials||[]).forEach(s=>out.push([s.sn,u.label,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step]));}
  name='npi_serials_'+(T.day||'')+'_all';
 }else{
  const p=PRODS.find(x=>x.product===which);
  snRows(which).forEach(s=>out.push([s.sn,which,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step]));
  name='npi_serials_'+(T.day||'')+'_'+which+((FS[which]&&FS[which]!=='all')?'_'+FS[which]:'');
 }
 const csv=[head].concat(out).map(r=>r.map(v=>{const t=String(v==null?'':v);
   return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;}).join(',')).join('\r\n');
 const file=name.replace(/[^\w.-]+/g,'_')+'.csv';
 if(SAVER){try{await SAVER.save({filename:file,data:'﻿'+csv});return;}
   catch(e){if(e&&e.code==='rejected')return;}}
 const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),u2=URL.createObjectURL(b);
 const a=document.createElement('a');a.href=u2;a.download=file;document.body.appendChild(a);
 a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u2),1500);
}

function draw(){
 tiles();unres();dayNote();
 const noH=PRODS.filter(p=>p.hours_source==='none');
 const all=[];AX.forEach(h=>{let u=0,pa=0,fa=0;
  PRODS.forEach(p=>(p.hours||[]).forEach(r=>{if(r.h===h){u+=r.units;pa+=r.pass;fa+=r.fail;}}));
  all.push({h:h,units:u,pass:pa,fail:fa});});
 document.getElementById('ch1').innerHTML=
  (AX.length?hourChart(all,'var(--good)','All products',1180,280)
   :'<div class="empty">No hourly data for today \u2014 no NPI tester appeared in the DPR export.</div>')
  +(noH.length?'<div class="colh" style="margin-top:7px;color:var(--warn)">not in these bars: '
    +noH.map(p=>esc(p.product)+' ('+p.units.toLocaleString()+' units, CMES \u2014 no timestamps)').join(', ')
    +'</div>':'');
 sections();wire('#ch1 .bar');
}
draw();
addEventListener('resize',draw);
</script>
