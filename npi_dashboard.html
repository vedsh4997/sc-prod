.pin{padding:14px 17px 17px}

.pkc{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.pkv{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.15}

  const R=rows[k]||(rows[k]={st:k,stage:t.stage||'',role:t.role||ROLE[k]||'',
                             exact:t.exact!==false,how:t.how||'',cells:{},u:0,f:0});
  if(t.exact===false) R.exact=false;
  const c=R.cells[r.h]||(R.cells[r.h]={u:0,f:0});
  c.u+=(t.units||0);c.f+=(t.fail||0);R.u+=(t.units||0);R.f+=(t.fail||0);
 }));
 const keys=Object.keys(rows).sort();
 if(!anyCnt||!keys.length)
  return '<div class="colh" style="margin-top:14px">per-station hourly: not available for this day '

    +'<div style="font-size:9.5px;color:'+yCol(y,floor)+'">'+(y==null?'':y.toFixed(0)+'%')+'</div></td>';
  }).join('');
  const yd=fy(R.u,R.f);
  return '<tr><td style="white-space:nowrap"><b>'+esc(k)+'</b>'
   +(R.role?'<div style="font-size:10px;color:var(--text-3)">'+esc(R.role)+(R.stage?' \u00b7 '+esc(R.stage):'')+'</div>':'')
   +(R.how==='inferred'?'<div style="font-size:10px;color:var(--warn)">inferred \u2014 confirm with --pin</div>'
     :R.how==='unknown'?'<div style="font-size:10px;color:var(--warn)">tester unknown \u2014 --pin it</div>'
     :R.exact?'':'<div style="font-size:10px;color:var(--warn)">shared operation \u2014 combined</div>')
   +'</td>'+cells
   +'<td class="num"><b>'+R.u+'</b><span style="color:'+(R.f?'var(--bad)':'var(--text-3)')+'"> / '+R.f+'</span>'
   +'<div style="font-size:9.5px;color:'+yCol(yd,floor)+'">'+(yd==null?'':yd.toFixed(1)+'%')+'</div></td></tr>';
 }).join('');
 return '<div class="colh" style="margin-top:16px">Hourly by station \u00b7 tested / failed first time \u00b7 first-pass %</div>'
  +'<div class="tbl-w"><table class="sgrid"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ---------- bar chart: units per hour, failures stacked on top ---------- */
function hourChart(rows,colour,label,W,H,clickKey){
 const by={};AX.forEach(h=>by[h]={units:0,pass:0,fail:0});
 (rows||[]).forEach(r=>{if(by[r.h]){by[r.h].units+=r.units;by[r.h].pass+=r.pass;by[r.h].fail+=r.fail;}});
 const max=Math.max(1,...AX.map(h=>by[h].units));
 const ML=42,MR=12,MT=26,MB=34,pw=W-ML-MR,ph=H-MT-MB;
 const slot=pw/Math.max(1,AX.length),bw=Math.min(44,slot*0.62),y=v=>MT+ph-(v/max)*ph;
 let g='';
 for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);
  g+='<line x1="'+ML+'" y1="'+yy+'" x2="'+(W-MR)+'" y2="'+yy+'" stroke="var(--border)"/>'
   +'<text x="'+(ML-7)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+Math.round(v)+'</text>';}
 AX.forEach((h,i)=>{
  const d=by[h],cx=ML+slot*i+slot/2;
  const every=AX.length>12?2:1;
  if(i%every===0)g+='<text x="'+cx+'" y="'+(MT+ph+14)+'" text-anchor="middle" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+hl(h)+'</text>';
  if(!d.units)return;
  const fpy=100*d.pass/d.units;
  const yTop=y(d.units),yPass=y(d.pass),hPass=MT+ph-yPass,hFail=yPass-yTop;
  const tip=encodeURIComponent('<b>'+label+' &middot; '+hl(h)+'</b><br>'+d.units+' tested<br>'
   +'<span style="color:var(--good)">&#9632;</span> '+d.pass+' passed first time<br>'
   +'<span style="color:var(--bad)">&#9632;</span> '+d.fail+' failed first time<br>first pass '+fpy.toFixed(1)+'%');
  const sel=(clickKey&&OPEN_H[clickKey]===h);
  g+='<g class="bar" data-tip="'+tip+'" data-h="'+h+'"'
   +(clickKey?' data-click="1" style="cursor:pointer"':'')+'>'
   +'<rect x="'+(cx-bw/2)+'" y="'+yPass+'" width="'+bw+'" height="'+Math.max(0,hPass)+'" fill="'+colour+'" opacity=".88"/>'
   +(d.fail?'<rect x="'+(cx-bw/2)+'" y="'+yTop+'" width="'+bw+'" height="'+Math.max(1,hFail-2)+'" rx="4" fill="var(--bad)" opacity=".92"/>':'')
   +(sel?'<rect x="'+(cx-bw/2-2)+'" y="'+(yTop-2)+'" width="'+(bw+4)+'" height="'+(MT+ph-yTop+4)+'" rx="5" fill="none" stroke="var(--text-1)" stroke-width="1.8"/>':'')
   +'<rect x="'+(cx-bw/2)+'" y="'+MT+'" width="'+bw+'" height="'+ph+'" fill="transparent"/></g>'
   +'<text x="'+cx+'" y="'+(yTop-6)+'" text-anchor="middle" font-size="9" font-weight="700" font-family="var(--mono)" fill="'
   +(fpy<(D.ramp_floor||90)?'var(--bad)':'var(--text-2)')+'">'+fpy.toFixed(0)+'%</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>';
}

 }
 const L2=C2.last||{};
 if(C2.generated&&L2.attempt&&L2.ok===false)
  parts.push('<span class="bad">latest attempt '
   +esc(String(L2.attempt).replace('T',' ').slice(11,16))+' failed: '+esc(L2.error||'')

 parts.push('<span><span class="k">daily (DPR) day</span><b>'+dd(T.day)+'</b></span>');

let DAY=null;                       /* which production day the sections show */

function ensureView(){
 /* resolve the default BEFORE anything renders -- the chip row is drawn by
    tiles(), which used to run while VIEW was still null, so no chip came up
    marked as the one being shown. */
 if(VIEW!==null) return VIEW;
 const cfg=Object.keys(D.configured||{}).filter(n=>!n.includes('?'));
 VIEW=(PRODS[0]&&PRODS[0].product)||cfg[0]||null;
 return VIEW;
}
function shown(){ ensureView(); return PRODS.filter(p=>p.product===VIEW); }
function pickView(v){
 VIEW=v;

}
function dayList(){ return D.today&&D.today.days||[]; }
function curDay(){
 const ds=dayList(); if(!ds.length) return null;
 return ds.find(x=>x.day===DAY)||ds[ds.length-1];
}

 DAY=d;

function applyDay(){
 /* point every product's hours at the chosen day. The day totals (tiles,
    testers, serial list) stay on the DPR/CMES day -- they are a different
    export and cannot be re-cut by hour. */
 const d=curDay(); if(!d) return;
 (T.products||[]).forEach(p=>{
  const blk=d.products[p.product];
  p.hours=blk||[];
  p.hours_source=(p.hours.length?'full':(p.units?'none':'full'));
  /* the label must follow the SELECTED day, or a live day reads "source DPR" */
  p.hours_from=d.live?(D.live_source||'HPR'):'DPR';
  p.hours_delta=0;
 });
}

/* ---------- one full section per product ---------- */
function sections(){
 if(!shown().length && VIEW){
  const cfg=(D.configured||{})[VIEW]||[];
  document.getElementById('sections').innerHTML=
   '<div class="psec"><div class="pbar" style="background:'+COL(VIEW)+'"></div><div class="pin">'
   +'<div class="phd"><span class="pdot" style="background:'+COL(VIEW)+'"></span>'
   +'<span class="pnm">'+esc(VIEW)+'</span>'
   +'<span class="ptest">'+esc(cfg.join(' \u00b7 '))+'</span></div>'
   +'<div class="empty">No units recorded for <b>'+esc(VIEW)+'</b> on any day in the window.<br><br>'
   +'Its tester(s): <b>'+esc(cfg.join(', ')||'none configured')+'</b>.<br>'
   +'If a tester is shared, every one of its units may be going to the other product &mdash; '
   +'run <code>python npi_dashboard.py --split '+esc((cfg[0]||'').replace(/[^\w-]/g,''))+'</code> '
   +'to see what separates them.</div></div></div>';
  return;
 }
 if(!shown().length){document.getElementById('sections').innerHTML=
   '<div class="card"><div class="empty">No NPI tester produced units today.<br>'
   +'Run <code>python npi_dashboard.py --diag</code> to see what the exports contain.</div></div>';return;}
 document.getElementById('sections').innerHTML=shown().map(p=>{
  const c=COL(p.product),fl=D.ramp_floor||90;
  const h=HIST[p.product];
  /* these describe the DAY ON SCREEN, computed from its own hours. Showing
     the newest DPR total above hour cards for a different day is what made
     the hourly look broken. */
  let du=0,dp=0,df=0;const dts=new Set();
  (p.hours||[]).forEach(r=>{du+=r.units;dp+=r.pass;df+=r.fail;
    (r.testers||[]).forEach(t=>dts.add(t.station));});
  const dfpy=du?100*dp/du:null;
  const k=[['Tested',du.toLocaleString(),''],
   ['First pass',(dfpy==null?'—':dfpy.toFixed(2)+'%'),(dfpy!=null&&dfpy<fl?'var(--bad)':'var(--good)')],
   ['Failed first time',String(df),(df?'var(--bad)':'')],
   ['Testers',String(dts.size||(p.testers||[]).length),''],
   ['In window',h?h.att.toLocaleString():'—','']];
  const tes=(p.testers||[]).map(t=>'<tr><td>'+esc(t.station)+'</td><td class="num">'+t.units
   +'</td><td class="num" style="color:'+(t.fails?'var(--bad)':'var(--text-3)')+'">'+t.fails
   +'</td><td class="num"><b>'+(t.fpy==null?'—':t.fpy.toFixed(1)+'%')+'</b></td>'
   +'<td>'+esc(t.first_ts||'')+(t.last_ts?' – '+esc(t.last_ts):'')+'</td></tr>').join('');
  /* PER-TESTER, FROM CMES. These are FAIL/RETEST RECORDS, not units tested:
     CMES names a tester only on a failure or retest record, so a unit that
     passed clean first time names no tester anywhere. Labelled on the card
     so it can never be read as a unit count. */
  const tf=(p.tester_fails||[]).slice().sort((a,b)=>b.records-a.records);
  const tfh=tf.length?('<div style="margin-top:14px"><div class="colh">Per tester'
   +' <span style="font-weight:400;color:var(--text-3)">\u00b7 fail / retest records'
   +' (CMES names a tester only on a failure)</span></div><div class="tbl-w"><table>'
   +'<thead><tr><th>Tester</th><th class="num">Records</th><th class="num">Units</th>'
   +'<th>Stage</th><th>Window</th><th>Top reason</th></tr></thead><tbody>'
   +tf.map(t=>'<tr><td><b>'+esc(t.station)+'</b></td>'
     +'<td class="num" style="color:'+(t.records?'var(--bad)':'var(--text-3)')+'">'+t.records+'</td>'
     +'<td class="num">'+t.units+'</td><td>'+esc((t.stages||[]).join(', '))+'</td>'
     +'<td>'+esc(t.first_ts||'')+(t.last_ts?' \u2013 '+esc(t.last_ts):'')+'</td>'
     +'<td>'+esc(t.top||'\u2014')+'</td></tr>').join('')
   +'</tbody></table></div>'
   +((p.testers_silent||[]).length?'<div class="card-s" style="margin-top:6px">No record from '
      +esc((p.testers_silent||[]).join(', '))+' \u2014 nothing failed on them, or they did not run.</div>':'')
   +'</div>'):'';
  const par=(p.pareto||[]).length?(p.pareto||[]).slice(0,10).map(s=>
    '<tr><td>'+esc(s.step||'—')+'</td><td class="num">'+s.n+'</td><td class="num">'+s.pct
    +'%</td><td class="num" style="color:var(--warn)">'+s.cum+'%</td></tr>').join('')
   :'<tr><td colspan="4" style="color:var(--text-3)">Nothing failed first time.</td></tr>';
  return '<div class="psec" id="p_'+encodeURIComponent(p.product)+'">'
   +'<div class="pbar" style="background:'+c+'"></div><div class="pin">'
   +'<div class="phd"><span class="pdot" style="background:'+c+'"></span>'
   +'<span class="pnm">'+esc(p.product)+'</span>'
   +'<span class="ptest">'+esc((p.expected||[]).join(' · '))+'</span></div>'
   +'<div class="pk">'+k.map(a=>'<div class="pkc"><div class="pkv"'
     +(a[2]?' style="color:'+a[2]+'"':'')+'>'+a[1]+'</div><div class="pkl">'+a[0]+'</div></div>').join('')+'</div>'
   +'<div class="colh">Hour by hour</div><div class="ch" data-p="'+esc(p.product)+'"></div>'
   +'<div id="hr_'+esc(p.product)+'"></div>'
   +'<div class="g2" style="margin-top:14px">'
     +'<div><div class="colh">Testers</div><div class="tbl-w"><table><thead><tr><th>Tester</th>'
       +'<th class="num">Units</th><th class="num">Fails</th><th class="num">FPY</th><th>Window</th></tr></thead>'
       +'<tbody>'+tes+'</tbody></table></div></div>'
     +'<div><div class="colh">Failing steps</div><div class="tbl-w"><table><thead><tr><th>Step</th>'
       +'<th class="num">n</th><th class="num">%</th><th class="num">Cum</th></tr></thead><tbody>'+par+'</tbody></table></div></div>'
   +'</div>'+tfh
   +'<div class="card-h" style="margin-top:16px"><span class="colh" style="margin:0">Serial numbers</span>'
     +'<span class="card-s" id="ss_'+esc(p.product)+'"></span>'
     +'<span class="acts"><button class="dl" onclick="dl(\''+esc(p.product)+'\')">&#8681; CSV</button>'
     +'<button class="dl solid" onclick="dl(\'ALL\')">&#8681; All products</button></span></div>'
   +'<div class="chips" id="sf_'+esc(p.product)+'"></div>'
   +'<div class="tbl-w"><table id="st_'+esc(p.product)+'"></table></div>'
   +'</div></div>';
 }).join('');
 shown().forEach(p=>{
  const box=document.querySelector('.ch[data-p="'+CSS.escape(p.product)+'"]');
  if(box){drawProductHours(p,box);renderHour(p.product);}
  snChips(p.product);snTable(p.product);});
 wire('.bar');
}

/* ---------- serials ---------- */
function snRows(prod){
 const p=PRODS.find(x=>x.product===prod);if(!p)return [];
 const f=FS[prod]||'all';
 return (p.serials||[]).filter(s=>f==='all'
   ||(f==='fail'&&s.status==='FAIL')||(f==='retest'&&s.outcome==='RETEST')
   ||(f==='scrap'&&s.outcome==='FAIL')||(f==='pass'&&s.outcome==='PASS'));
}
function snChips(prod){
 const p=PRODS.find(x=>x.product===prod);if(!p)return;
 const S=p.serials||[],n=k=>S.filter(k).length,f=FS[prod]||'all';
 const defs=[['all','All',S.length],['fail','Failed first time',n(s=>s.status==='FAIL')],
  ['retest','Passed on retest',n(s=>s.outcome==='RETEST')],
  ['scrap','Never passed',n(s=>s.outcome==='FAIL')],
  ['pass','Passed first time',n(s=>s.outcome==='PASS')]];
 document.getElementById('sf_'+prod).innerHTML=defs.map(d=>
  '<button class="chip '+(f===d[0]?'on':'')+'" onclick="setF(\''+prod+'\',\''+d[0]+'\')">'
  +d[1]+' <b>'+d[2]+'</b></button>').join('');
}
function setF(prod,k){FS[prod]=k;snChips(prod);snTable(prod);}
function snTable(prod){
 const rows=snRows(prod),p=PRODS.find(x=>x.product===prod);
 document.getElementById('ss_'+prod).textContent=
  rows.length.toLocaleString()+' of '+((p.serials||[]).length).toLocaleString()
  +' shown · last 4 digits only · the CSV carries the full serial';
 const body=rows.slice(0,500).map((s,i)=>{
  const pill=s.outcome==='PASS'?'<span class="pill ok">PASS</span>'
   :s.outcome==='RETEST'?'<span class="pill rt">RETEST</span>':'<span class="pill no">NEVER PASSED</span>';
  return '<tr><td class="num" style="color:var(--text-3)">'+(i+1)+'</td><td>'+esc(mask(s.sn))+'</td>'
   +'<td>'+esc(s.tester||'')+'</td><td>'+esc(s.ts||'')+'</td>'
   +'<td>'+(s.status==='FAIL'?'<span class="pill no">FAIL</span>':'<span class="pill ok">PASS</span>')+'</td>'
   +'<td>'+pill+'</td><td class="num">'+(s.attempts||1)+'</td>'
   +'<td style="color:var(--text-2)">'+esc(s.step||'—')+'</td></tr>';}).join('');
 document.getElementById('st_'+prod).innerHTML=
  '<thead><tr><th></th><th>Serial &middot; last 4</th><th>Tester</th><th>Time</th>'
  +'<th>First try</th><th>Outcome</th><th class="num">Tries</th><th>First failing step</th></tr></thead>'
  +'<tbody>'+body+'</tbody>';
}
let SAVER=null;
if(window.claude&&claude.use)claude.use('downloads').then(d=>{SAVER=d;}).catch(()=>{});
async function dl(which){
 const head=['Serial Number','Product','Tester','Time','First Try','Outcome','Attempts','First Failing Step'];
 let out=[],name='';
 if(which==='ALL'){
  PRODS.forEach(p=>(p.serials||[]).forEach(s=>out.push([s.sn,p.product,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step])));
  const u=T.unresolved;
  if(u){const up=(T.products||[]).find(x=>x.product===u.label);
   (up&&up.serials||[]).forEach(s=>out.push([s.sn,u.label,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step]));}
  name='npi_serials_'+(T.day||'')+'_all';
 }else{
  const p=PRODS.find(x=>x.product===which);
  snRows(which).forEach(s=>out.push([s.sn,which,s.tester,s.ts,s.status,s.outcome,s.attempts,s.step]));
  name='npi_serials_'+(T.day||'')+'_'+which+((FS[which]&&FS[which]!=='all')?'_'+FS[which]:'');
 }
 const csv=[head].concat(out).map(r=>r.map(v=>{const t=String(v==null?'':v);
   return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;}).join(',')).join('\r\n');
 const file=name.replace(/[^\w.-]+/g,'_')+'.csv';
 if(SAVER){try{await SAVER.save({filename:file,data:'﻿'+csv});return;}
   catch(e){if(e&&e.code==='rejected')return;}}
 const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),u2=URL.createObjectURL(b);
 const a=document.createElement('a');a.href=u2;a.download=file;document.body.appendChild(a);
 a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u2),1500);
}

function overall(){
 const noH=PRODS.filter(p=>p.hours_source==='none');
 /* the axis follows the chosen day, not the day the page was built for */
 const hs=[];PRODS.forEach(p=>(p.hours||[]).forEach(r=>hs.push(r.h)));
 AX.length=0;
 if(hs.length){for(let h=Math.min(...hs);h<=Math.max(...hs);h++)AX.push(h);}
 const all=[];AX.forEach(h=>{let u=0,pa=0,fa=0;
  PRODS.forEach(p=>(p.hours||[]).forEach(r=>{if(r.h===h){u+=r.units;pa+=r.pass;fa+=r.fail;}}));
  all.push({h:h,units:u,pass:pa,fail:fa});});
 document.getElementById('ch1').innerHTML=
  (AX.length?hourChart(all,'var(--good)','All products',1180,280)
   :'<div class="empty">No hourly data for today \u2014 no NPI tester appeared in the DPR export.</div>')
  +(noH.length?'<div class="colh" style="margin-top:7px;color:var(--warn)">not in these bars: '
    +noH.map(p=>esc(p.product)+' ('+p.units.toLocaleString()+' units, CMES \u2014 no timestamps)').join(', ')
    +'</div>':'');
 wire('#ch1 .bar');
}
/* BACKUP: the NPI testers straight from the exports, independent of CMES.
   HPR = hourly (newest HPR day). DPR = daily (closed days). Every tester has
   a row in both; a tester absent from an export is SAID, not left blank. */
function drawBackup(){
 const el=document.getElementById('backup'),B=D.backup;
 if(!el||!B) return;
 const floor=D.ramp_floor||90;
 const dd=s=>String(s||'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
 const fy=(u,f)=>u?((u-f)/u*100):null;
 const cell=(c,tip)=>{
  if(!c||!(c.u||c.f)) return '<td class="num" style="color:var(--text-3)">\u00b7</td>';
  const y=fy(c.u,c.f);
  /* s=1: from the export's station SUMMARY, final pass -- not first pass */
  return '<td class="num" title="'+esc(tip)+' \u2014 '+c.u+' tested, '+c.f+' failed'
   +(c.s===2?' (station summary, FINAL pass)':c.s?' (station summary)':'')+'">'
   +'<b>'+c.u+'</b><span style="color:'+(c.f?'var(--bad)':'var(--text-3)')+'"> / '+c.f+'</span>'
   +'<div style="font-size:9.5px;color:'+yCol(y,floor)+'">'+(y==null?'':y.toFixed(0)+'%')
   +(c.s===2?' <span style="color:var(--warn)">fin</span>':'')+'</div></td>';};
 const tot=(m,keys)=>{let u=0,f=0;keys.forEach(k=>{const c=(m||{})[k];if(c){u+=c.u;f+=c.f;}});return {u,f};};
 const grid=(cols,colLab,rows,missing,srcName,summ)=>{
  summ=summ||[];
  if(!cols.length) return '<div class="empty">'+srcName+' has no data for these testers in the window.</div>';
  const th='<th style="text-align:left">Tester</th>'+cols.map(c=>'<th class="num">'+esc(colLab(c))+'</th>').join('')
   +'<th class="num">Total</th>';
  const body=B.testers.map(T=>{
   const m=rows[T.name]||{};const miss=missing.indexOf(T.name)>=0;
   const t=tot(m,cols),y=fy(t.u,t.f);
   return '<tr><td style="white-space:nowrap"><b>'+esc(T.name)+'</b>'
    +(T.role?'<div style="font-size:10px;color:var(--text-3)">'+esc(T.role)+'</div>':'')
    +(miss?'<div style="font-size:10px;color:var(--warn)">not in the '+srcName+'</div>':'')
    +(summ.indexOf(T.name)>=0?'<div style="font-size:10px;color:var(--text-3)">from the '+srcName
       +' station summary (no raw rows)</div>':'')
    +'</td>'+cols.map(c=>cell(m[c],T.name+' '+colLab(c))).join('')
    +'<td class="num"><b>'+t.u+'</b><span style="color:'+(t.f?'var(--bad)':'var(--text-3)')+'"> / '+t.f+'</span>'
    +'<div style="font-size:9.5px;color:'+yCol(y,floor)+'">'+(y==null?'':y.toFixed(1)+'%')+'</div></td></tr>';
  }).join('');
  return '<div class="tbl-w"><table class="sgrid"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';};
 const H=B.hpr||{},P=B.dpr||{},hs=(H.status||{});
 const hcols=(H.hours||[]).map(String);
 el.innerHTML='<div class="card" style="margin-top:22px">'
  +'<div class="card-h"><span class="card-t">Backup \u00b7 straight from the exports</span>'
  +'<span class="card-s">independent of CMES \u00b7 tested / failed first time \u00b7 first-pass %</span></div>'
  +'<div class="colh" style="margin-top:10px">HPR \u00b7 hourly \u00b7 '
  +(H.day?esc(dd(H.day)):'no HPR day found')
  +(hs.latest_mtime?' \u00b7 newest file '+esc(hs.latest_mtime):'')+'</div>'
  +grid(hcols,h=>String(h).padStart(2,'0')+'h',H.rows||{},H.missing||[],'HPR',H.summary_only)
  +'<div class="colh" style="margin-top:18px">DPR \u00b7 daily \u00b7 closed days</div>'
  +grid(P.days||[],d=>dd(d).slice(5),P.rows||{},P.missing||[],'DPR',P.summary_only)
  +'</div>';
}
function draw(){
 ensureView();
 applyDay();
 tiles();unres();dayNote();fresh();drawBar();
 overall();sections();drawBackup();
}
draw();
addEventListener('resize',draw);
