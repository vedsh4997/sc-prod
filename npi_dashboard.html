<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPI · New Product Introduction</title>
<style>
:root{
  --bg:#f7f6ef; --surface:#ffffff; --surface-2:#f1efe4; --border:#e0dccb;
  --border-2:#c9c4ae; --text-0:#14140f; --text-1:#2b2b24; --text-2:#6b6a5c;
  --text-3:#9b9a8a; --good:#1a7f37; --warn:#9a6a00; --bad:#b3261e;
  --accent:#14b8a6; --bg-0:#ffffff;
}
[data-theme="dark"]{
  --bg:#0e1b2a; --surface:#16293d; --surface-2:#1e3a54; --border:#27405a;
  --border-2:#365madd; --text-0:#e8eef4; --text-1:#d3dde7; --text-2:#8fa6bc;
  --text-3:#6d8094; --good:#3dd68c; --warn:#f5a623; --bad:#ef6461;
  --accent:#2dd4bf; --bg-0:#0e1b2a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-1);
 font-family:'Segoe UI',Calibri,Arial,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
h1{font-size:25px;margin:0 0 2px;color:var(--text-0);letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;margin-bottom:20px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.thm{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;
 border:1px solid var(--border);border-radius:16px;padding:4px 12px;background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{padding:11px 18px;border-radius:11px;cursor:pointer;background:var(--surface);
 border:1px solid var(--border);min-width:150px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent)}
.btn-n{font-size:16px;font-weight:800;color:var(--text-0)}
.btn.on .btn-n{color:var(--bg-0)}
.btn-s{font-size:10.5px;color:var(--text-2);margin-top:2px}
.btn.on .btn-s{color:var(--bg-0);opacity:.8}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:16px}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.kv{font-size:23px;font-weight:800;line-height:1.1;color:var(--text-0)}
.kl{font-size:9.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.lbl{font-size:9.5px;color:var(--text-3);text-transform:uppercase;
 letter-spacing:.07em;margin:22px 0 6px}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);
 border:1px solid var(--border);border-radius:11px;overflow:hidden;table-layout:fixed}
th{text-align:left;font-size:9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;
 color:var(--text-3);padding:9px 12px;background:var(--surface-2);font-weight:700}
td{padding:8px 12px;border-top:1px solid var(--border)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.tot td{background:var(--surface-2);font-weight:800;border-top:2px solid var(--border-2)}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:10px;
 font-weight:800;color:var(--bg-0)}
.src{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.06em;
 padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--bg-0);margin-left:6px}
.note{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:11.5px;line-height:1.6;
 background:var(--surface-2);border-left:3px solid var(--warn);color:var(--text-1)}
.note.ok{border-left-color:var(--good)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.chip{padding:4px 12px;border-radius:16px;font-size:11.5px;cursor:pointer;
 background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg-0)}
.wk{display:flex;gap:6px;align-items:flex-end;height:74px;margin:6px 0}
.wk div{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.wkl{display:flex;gap:6px;font-size:9px;color:var(--text-3)}
.wkl div{flex:1;text-align:center}
.empty{padding:22px 0;color:var(--text-3);font-size:12.5px}
.sub-line{font-size:12px;color:var(--text-2);line-height:1.65;margin:-4px 0 4px;padding:0 2px}
.vr{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;
 padding:2px 8px;border-radius:5px;color:var(--bg-0)}
.vr-NA{background:#2563eb}
.vr-INT{background:#9333ea}
tbody tr:hover td,tr:hover td{background:var(--surface-2)}
.btn,.chip,.kc,table{transition:border-color .14s,background .14s,box-shadow .14s}
.kc:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn{box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn.on{box-shadow:0 2px 12px rgba(20,184,166,.28)}
.foot{margin-top:28px;font-size:10.5px;color:var(--text-3);line-height:1.6}
@media(max-width:700px){.wrap{padding:16px 12px 40px}}
</style></head><body>
<div class="wrap">
  <div class="top">
    <h1>New Product Introduction</h1>
    <span class="thm" onclick="tgl()">light / dark</span>
  </div>
  <div class="sub" id="sub"></div>
  <div class="btns" id="btns"></div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const D = {"generated": "2026-09-25 12:52", "build": "npi-dash-v2", "window_weeks": 8, "ramp_floor": 90.0, "configured": {"IQ10B": ["FTE-005", "HT-93"], "IQ10EV": ["GTC-67", "HVT004"], "SST": ["HVT003"]}, "today": {"day": "20260919", "source": "DPR", "products": [{"product": "SST", "units": 1, "fails": 1, "fpy": 0.0, "expected": ["HVT003"], "golden": null, "pareto": [{"step": "cal_kestrel", "n": 1, "pct": 100.0, "cum": 100.0}], "serials": [{"sn": "542637024638", "tester": "HVT003", "variant": "", "outcome": "FAIL", "status": "FAIL", "attempts": 1, "step": "cal_kestrel", "ts": "12:57"}], "testers": [{"station": "HVT003", "units": 1, "fails": 1, "fpy": 0.0, "first_ts": "12:57", "last_ts": "12:57", "pareto": [{"step": "cal_kestrel", "n": 1}], "hourly": []}]}, {"product": "IQ10B", "units": 1, "fails": 1, "fpy": 0.0, "testers": [{"station": "HT93", "units": 1, "fails": 1, "fpy": 0.0, "pareto": [], "hourly": [], "first_ts": "", "last_ts": "", "source": "CMES", "combined": false, "retest_pass": 1, "retest_fail": 2}], "pareto": [{"step": "\u2014", "n": 1, "pct": 100.0, "cum": 100.0}], "serials": [{"sn": "542634058890", "station": "EL05.HT93", "variant": "INT", "part": "800-00384", "status": "FAIL", "outcome": "FAIL", "attempts": 1, "step": "", "ts": "", "source": "CMES"}], "golden": null, "expected": ["FTE-005", "HT-93"], "day": "20260925", "source": "CMES", "cmes_rows": [{"product": "EP5000", "operation": "EL07.HT", "input": 1, "first_pass": 0, "first_fail": 1, "retest_pass": 0, "retest_fail": 2, "output": 0}, {"product": "EP5001", "operation": "EL07.FT", "input": 0, "first_pass": 0, "first_fail": 0, "retest_pass": 1, "retest_fail": 0, "output": 1}], "golden_identified": 0, "golden_exact": false, "golden_caveat": "CMES reports pre-aggregated counts, so only golden units that appear by serial in the fail history can be removed. A golden that passed clean is not distinguishable and remains in the totals.", "final_pass": 1, "first_pass_only": 0}], "missing": [{"product": "IQ10B", "station": "FTE-005"}, {"product": "IQ10EV", "station": "GTC-67"}, {"product": "IQ10EV", "station": "HVT004"}], "ramp_floor": 90.0, "cmes_note": "Serials listed are units that failed or retested on FTE-005, HT93. CMES has no endpoint listing units that passed clean first time, so those are counted but not listed. Counts are attributable to FTE-005, HT93 alone."}, "history": {"SST": {"weeks": [{"week": "2026-W34", "att": 10, "fp": 8, "fails": 2, "days": 1, "first": "20260823", "last": "20260823", "fpy": 80.0}, {"week": "2026-W35", "att": 84, "fp": 55, "fails": 29, "days": 4, "first": "20260826", "last": "20260829", "fpy": 65.48}, {"week": "2026-W36", "att": 75, "fp": 50, "fails": 25, "days": 3, "first": "20260901", "last": "20260904", "fpy": 66.67}, {"week": "2026-W37", "att": 59, "fp": 37, "fails": 22, "days": 3, "first": "20260911", "last": "20260913", "fpy": 62.71}, {"week": "2026-W38", "att": 98, "fp": 56, "fails": 42, "days": 4, "first": "20260915", "last": "20260919", "fpy": 57.14}], "days": [{"day": "20260823", "att": 10, "fp": 8, "fails": 2, "fpy": 80.0, "symptoms": {"cal_kestrel": 1, "finish_test": 1}}, {"day": "20260826", "att": 9, "fp": 5, "fails": 4, "fpy": 55.56, "symptoms": {"cal_kestrel": 4}}, {"day": "20260827", "att": 15, "fp": 9, "fails": 6, "fpy": 60.0, "symptoms": {"cal_kestrel": 2, "finish_test": 4}}, {"day": "20260828", "att": 27, "fp": 17, "fails": 10, "fpy": 62.96, "symptoms": {"cal_kestrel": 8, "finish_test": 2}}, {"day": "20260829", "att": 33, "fp": 24, "fails": 9, "fpy": 72.73, "symptoms": {"cal_kestrel": 7, "finish_test": 2}}, {"day": "20260901", "att": 51, "fp": 35, "fails": 16, "fpy": 68.63, "symptoms": {"cal_kestrel": 10, "finish_test": 6}}, {"day": "20260902", "att": 17, "fp": 9, "fails": 8, "fpy": 52.94, "symptoms": {"areacheck": 1, "finish_test": 5, "cal_kestrel": 2}}, {"day": "20260904", "att": 7, "fp": 6, "fails": 1, "fpy": 85.71, "symptoms": {"cal_kestrel": 1}}, {"day": "20260911", "att": 3, "fp": 0, "fails": 3, "fpy": 0.0, "symptoms": {"finish_test": 1, "check_deviations": 1, "cal_kestrel": 1}}, {"day": "20260912", "att": 26, "fp": 13, "fails": 13, "fpy": 50.0, "symptoms": {"cal_kestrel": 11, "finish_test": 2}}, {"day": "20260913", "att": 30, "fp": 24, "fails": 6, "fpy": 80.0, "symptoms": {"cal_kestrel": 3, "finish_test": 3}}, {"day": "20260915", "att": 41, "fp": 28, "fails": 13, "fpy": 68.29, "symptoms": {"finish_test": 4, "cal_kestrel": 9}}, {"day": "20260916", "att": 45, "fp": 26, "fails": 19, "fpy": 57.78, "symptoms": {"cal_kestrel": 13, "finish_test": 6}}, {"day": "20260917", "att": 11, "fp": 2, "fails": 9, "fpy": 18.18, "symptoms": {"cal_kestrel": 8, "finish_test": 1}}, {"day": "20260919", "att": 1, "fp": 0, "fails": 1, "fpy": 0.0, "symptoms": {"cal_kestrel": 1}}], "att": 326, "fp": 206, "fails": 120, "fpy": 63.19, "change": -22.86, "testers": {"HVT003": {"station": "HVT003", "att": 326, "fp": 206, "fails": 120, "days": 15, "fpy": 63.19}}, "source": "DPR"}, "IQ10B": {"weeks": [{"week": "2026-W39", "att": 43, "fp": 29, "fails": 14, "days": 3, "first": "20260923", "last": "20260925", "fpy": 67.44}], "days": [{"day": "20260923", "att": 21, "fp": 15, "fails": 6, "fpy": 71.43, "by_variant": {"NA": {"input": 18, "first_pass": 12, "first_fail": 6, "retest_pass": 9, "retest_fail": 4, "fpy": 66.67}, "INT": {"input": 3, "first_pass": 3, "first_fail": 0, "retest_pass": 4, "retest_fail": 4, "fpy": 100.0}}, "symptoms": {"\u2014": 6}}, {"day": "20260924", "att": 21, "fp": 14, "fails": 7, "fpy": 66.67, "by_variant": {"NA": {"input": 11, "first_pass": 6, "first_fail": 5, "retest_pass": 1, "retest_fail": 12, "fpy": 54.55}, "INT": {"input": 10, "first_pass": 8, "first_fail": 2, "retest_pass": 2, "retest_fail": 3, "fpy": 80.0}}, "symptoms": {"\u2014": 7}}, {"day": "20260925", "att": 1, "fp": 0, "fails": 1, "fpy": 0.0, "by_variant": {"NA": {"input": 1, "first_pass": 0, "first_fail": 1, "retest_pass": 0, "retest_fail": 2, "fpy": 0.0}, "INT": {"input": 0, "first_pass": 0, "first_fail": 0, "retest_pass": 1, "retest_fail": 0, "fpy": null}}, "symptoms": {"\u2014": 1}}], "att": 43, "fp": 29, "fails": 14, "fpy": 67.44, "change": null, "testers": {}, "source": "CMES"}}, "by_variant": {"IQ10B": {"NA": {"input": 1, "first_pass": 0, "first_fail": 1, "retest_pass": 0, "retest_fail": 2, "fpy": 0.0}, "INT": {"input": 0, "first_pass": 0, "first_fail": 0, "retest_pass": 1, "retest_fail": 0, "fpy": null}}}, "variant_order": ["NA", "INT"], "history_source": "DPR + CMES"};
let SEL=null, SNF='notpass';

function tgl(){
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark');
  try{ localStorage.setItem('npi_theme', r.getAttribute('data-theme')); }catch(e){}
}
try{ document.documentElement.setAttribute('data-theme',
     localStorage.getItem('npi_theme')||'light'); }catch(e){}

function col(v,f){ return v==null?'var(--text-3)':(v>=97?'var(--good)':(v>=f?'var(--warn)':'var(--bad)')); }
function pick(p){ SEL=p; render(); }
function snf(f){ SNF=f; render(); }
// Full serial numbers. This page is for the ramp team, who need to pull the
// exact board off the rack — a masked serial is useless to them.
function mask(sn){ return String(sn||''); }
function variantOf(u){ return u.variant || ''; }

function render(){
  const floor=D.ramp_floor||90;
  const today=D.today||{}, hist=D.history||{};
  const cfg=D.configured||{};
  const names=Object.keys(cfg);
  if(!names.length){ document.getElementById('body').innerHTML=
      '<div class="empty">No NPI products configured.</div>'; return; }
  if(!SEL||names.indexOf(SEL)<0) SEL=names[0];

  document.getElementById('sub').textContent =
    'Dedicated NPI testers \u00b7 first attempt per serial \u00b7 golden samples excluded \u00b7 '
    + (D.window_weeks||8) + '-week history \u00b7 generated ' + (D.generated||'');

  document.getElementById('btns').innerHTML = names.map(function(n){
    const t=(today.products||[]).filter(x=>x.product===n)[0];
    const h=hist[n];
    const s = (t&&t.retest_only) ? ('retest only \u00b7 '+(t.retest_pass||0)+'\u2713 '+(t.retest_fail||0)+'\u2717')
              : t ? (t.units.toLocaleString()+' today \u00b7 '+(t.fpy==null?'\u2014':t.fpy.toFixed(1)+'%'))
              : (h ? (h.att.toLocaleString()+' in window \u00b7 '+(h.fpy==null?'\u2014':h.fpy.toFixed(1)+'%'))
                   : 'no data');
    return '<div class="btn'+(n===SEL?' on':'')+'" onclick="pick(\''+n+'\')">'
      +'<div class="btn-n">'+n+'</div><div class="btn-s">'+s+'</div></div>';
  }).join('');

  const P=(today.products||[]).filter(x=>x.product===SEL)[0];
  const Hh=hist[SEL];
  let out='';

  // ---- today ----
  if(P&&P.retest_only){
    // No first-pass input today. Showing a yield here would be inventing one.
    out+='<div class="lbl">Today \u00b7 '+(P.day||today.day||'')+' from '+(P.source||today.source||'CMES')+'</div>'
      +'<div class="k">'
      +'<div class="kc"><div class="kv" style="color:var(--text-3)">\u2014</div>'
        +'<div class="kl">First pass</div></div>'
      +'<div class="kc"><div class="kv" style="color:var(--good)">'+(P.retest_pass||0)
        +'</div><div class="kl">Retest pass</div></div>'
      +'<div class="kc"><div class="kv" style="color:var(--bad)">'+(P.retest_fail||0)
        +'</div><div class="kl">Retest fail</div></div>'
      +'<div class="kc"><div class="kv">'+(P.output||0)+'</div>'
        +'<div class="kl">Output</div></div>'
      +'</div>'
      +'<div class="note"><b>Retest-only day.</b> CMES reports no first-pass input '
      +'for '+SEL+' today \u2014 only units coming back for retest. A first-pass '
      +'yield cannot be computed from that, so it is shown as \u2014 rather than '
      +'as 100%.</div>';
  } else if(P){
    // Each product carries its own day and source. The DPR archive lags, so a
    // CMES-sourced product stamped with the newest DPR date read as days old.
    const pass=P.units-P.fails;
    // retests summed across this product's testers
    const RT=(P.testers||[]).reduce(function(a,t){
      a.p+=(t.retest_pass||0); a.f+=(t.retest_fail||0); return a; },{p:0,f:0});
    // FINAL pass/fail: what actually came out good, as opposed to first-pass.
    const FN=(P.testers||[]).reduce(function(a,t){
      a.p+=(t.final_pass||0); a.f+=(t.final_fail||0); return a; },{p:0,f:0});
    // PASS is what came out good, not what passed first time. CMES calls it
    // OUTPUT QTY and it equals FIRST PASS + RETEST PASS. Showing first-pass
    // here read as 11 on a day CMES said 18.
    const GOOD = FN.p || pass;
    const BAD  = (P.first_pass_only!=null) ? (P.units - P.first_pass_only) : P.fails;
    out+='<div class="lbl">Today \u00b7 '+(P.day||today.day||'')+' from '+(P.source||today.source||'DPR')+'</div>'
      +'<div class="k">'
      +'<div class="kc"><div class="kv">'+P.units.toLocaleString()+'</div>'
        +'<div class="kl">Tested</div></div>'
      +'<div class="kc"><div class="kv" style="color:var(--good)">'+GOOD.toLocaleString()+'</div>'
        +'<div class="kl">Pass \u00b7 good out</div></div>'
      +'<div class="kc"><div class="kv" style="color:var(--bad)">'+BAD.toLocaleString()+'</div>'
        +'<div class="kl">Failed first time</div></div>'
      +'</div>'
      +'<div class="sub-line">First pass '
        +(P.fpy==null?'\u2014':'<b style="color:'+col(P.fpy,floor)+'">'+P.fpy.toFixed(2)+'%</b>')
        +'. '+(P.golden_identified
          ? ('<b>'+P.golden_identified+'</b> golden unit(s) removed from these counts.')
          : (P.golden_exact===false ? 'Golden removed where identifiable.'
                                    : 'Golden samples excluded.'))
        +((RT.p||RT.f)?(' <b>'+RT.p+'</b> passed on a later retest, <b>'+RT.f
          +'</b> failed again.'):'')
        +(FN.p?(' Pass = '+(P.first_pass_only!=null?P.first_pass_only:pass)+' first pass + '
          +RT.p+' retest pass = <b>'+FN.p+'</b>.'):'')
      +'</div>';

    // The CMES rows verbatim, so the page can be checked against the screen.
    if((P.cmes_rows||[]).length){
      out+='<div class="lbl">CMES rows \u00b7 as reported</div><table>'
        +'<colgroup><col style="width:104px"><col style="width:120px"><col style="width:74px">'
        +'<col style="width:86px"><col style="width:82px"><col style="width:92px">'
        +'<col style="width:88px"><col style="width:84px"></colgroup>'
        +'<tr><th>Product</th><th>Operation</th><th class="n">Input</th>'
        +'<th class="n">First pass</th><th class="n">First fail</th>'
        +'<th class="n">Retest pass</th><th class="n">Retest fail</th>'
        +'<th class="n">Output</th></tr>';
      let ti=0,tf=0,tff=0,trp=0,trf=0,to=0;
      P.cmes_rows.forEach(function(r){
        ti+=r.input; tf+=r.first_pass; tff+=r.first_fail;
        trp+=r.retest_pass; trf+=r.retest_fail; to+=r.output;
        out+='<tr><td>'+r.product+'</td><td>'+r.operation+'</td>'
          +'<td class="n">'+r.input+'</td><td class="n">'+r.first_pass+'</td>'
          +'<td class="n">'+r.first_fail+'</td><td class="n">'+r.retest_pass+'</td>'
          +'<td class="n">'+r.retest_fail+'</td>'
          +'<td class="n" style="font-weight:800">'+r.output+'</td></tr>';
      });
      out+='<tr class="tot"><td>Total</td><td></td><td class="n">'+ti+'</td>'
        +'<td class="n">'+tf+'</td><td class="n">'+tff+'</td><td class="n">'+trp+'</td>'
        +'<td class="n">'+trf+'</td><td class="n">'+to+'</td></tr></table>'
        +'<div style="font-size:10.5px;color:var(--text-3);margin-top:5px">'
        +'FT and HT stages only \u2014 other stages (GLUE_HT and so on) are the '
        +'same units counted again and are excluded. These are the CMES figures '
        +'before golden removal; the cards above have golden taken out.</div>'
        +(P.golden_caveat?('<div class="note">'+P.golden_caveat+'</div>'):'');
    }

    // NA vs INT. IQ10B ships in two variants (part 800-00383 = NA,
    // 800-00384 = INT) and they are different builds — one averaged number
    // hides which of the two is actually struggling.
    const BV=(D.by_variant&&D.by_variant[SEL])||null;
    if(BV){
      const order=(D.variant_order||['NA','INT']);
      out+='<div class="lbl">By type</div><div class="k">'
        +order.filter(v=>BV[v]).map(function(v){
          const b=BV[v], att=b.input||0, pass=b.first_pass||0;
          const f=att?(pass/att*100):null;
          return '<div class="kc"><div style="display:flex;align-items:baseline;gap:8px">'
            +'<span class="vr vr-'+v+'">'+v+'</span>'
            +'<span class="kv" style="color:'+col(f,floor)+'">'
            +(att?(f.toFixed(1)+'%'):'<span style="font-size:15px;color:var(--text-3)">no units</span>')
            +'</span></div>'
            +'<div class="kl">'+(att?(pass+' of '+att+' first pass'):'nothing built today')+'</div></div>';
        }).join('')+'</div>';
    }

    out+='<div class="lbl">Testers today</div><table>'
      +'<colgroup><col><col style="width:92px"><col style="width:92px"><col style="width:92px">'
      +'<col style="width:96px"><col style="width:34%"></colgroup>'
      +'<tr><th>Tester</th><th class="n">Tested</th><th class="n">Pass</th>'
      +'<th class="n">Fail</th><th class="n">FPY</th><th>Top failing step</th></tr>';
    (P.testers||[]).forEach(function(t){
      out+='<tr><td><b>'+t.station+'</b>'+(t.source==='CMES'?'<span class="src">CMES</span>':'')+'</td>'
        +'<td class="n">'+t.units.toLocaleString()+'</td>'
        +'<td class="n" style="color:var(--good)">'+(t.units-t.fails).toLocaleString()+'</td>'
        +'<td class="n" style="color:var(--bad)">'+t.fails+'</td>'
        +'<td class="n" style="color:'+col(t.fpy,floor)+';font-weight:700">'
        +(t.fpy==null?'\u2014':t.fpy.toFixed(2)+'%')+'</td>'
        +'<td>'+(((t.pareto||[])[0]||{}).step||'\u2014')+'</td></tr>';
    });
    ((today.missing)||[]).filter(m=>m.product===SEL).forEach(function(m){
      out+='<tr><td style="color:var(--text-3)">'+m.station+'</td>'
        +'<td colspan="5" style="color:var(--warn);font-size:11px">no units today</td></tr>';
    });
    out+='</table>';

    if((P.pareto||[]).length){
      out+='<div class="lbl">Failing steps today</div><table>'
        +'<colgroup><col><col style="width:92px"><col style="width:92px"><col style="width:110px"></colgroup>'
        +'<tr><th>Step</th><th class="n">Count</th><th class="n">Share</th><th class="n">Cumulative</th></tr>';
      P.pareto.forEach(r=>{ out+='<tr><td>'+r.step+'</td><td class="n">'+r.n+'</td>'
        +'<td class="n">'+r.pct+'%</td><td class="n" style="color:var(--warn)">'+r.cum+'%</td></tr>'; });
      out+='</table>';
    }

    if(P.golden&&P.golden.units){
      out+='<div class="lbl">Golden samples \u2014 not counted in yield</div>'
        +'<div class="note'+(P.golden.fails?'':' ok')+'">'
        +P.golden.units+' golden unit(s), '+P.golden.fails+' failed. '
        +(P.golden.fails?'A failing golden means the tester is drifting, not the build.'
                        :'All golden checks passed.')+'</div>';
    }

    // serials
    const S=P.serials||[];
    if(S.length){
      const fp=S.filter(r=>r.outcome==='PASS'), rt=S.filter(r=>r.outcome==='RETEST'),
            nv=S.filter(r=>r.outcome==='FAIL');
      const show = SNF==='all'?S : SNF==='retest'?rt : SNF==='never'?nv : nv.concat(rt);
      const chip=(k,l,n)=>'<span class="chip'+(SNF===k?' on':'')+'" onclick="snf(\''+k+'\')">'+l+' <b>'+n+'</b></span>';
      out+='<div class="lbl">Serial numbers</div><div class="chips">'
        +chip('notpass','Failed first time',nv.length+rt.length)
        +chip('never','Never passed',nv.length)
        +chip('retest','Passed on retest',rt.length)
        +chip('pass','Passed first time',fp.length)
        +chip('all','All',S.length)+'</div><table>'
        +'<colgroup><col style="width:38px"><col style="width:160px"><col style="width:74px">'
        +'<col style="width:178px"><col><col style="width:64px"></colgroup>'
        +'<tr><th class="n">#</th><th>Serial number</th><th>Type</th><th>1st try</th>'
        +'<th>Final outcome</th><th>First failing step</th><th class="n">Time</th></tr>';
      const OUT={PASS:['PASS FIRST','var(--good)'],RETEST:['PASSED ON RETEST','var(--warn)'],
                 FAIL:['NEVER PASSED','var(--bad)']};
      show.forEach(function(r,i){
        const o=OUT[r.outcome]||OUT.FAIL;
        out+='<tr><td class="n" style="color:var(--text-3)">'+(i+1)+'</td>'
          +'<td style="font-family:Consolas,monospace;letter-spacing:.3px">'+mask(r.sn)+'</td>'
          +'<td>'+(r.variant?'<span class="vr vr-'+r.variant+'">'+r.variant+'</span>':'\u2014')+'</td>'
          +'<td><span class="pill" style="background:'+(r.status==='FAIL'?'var(--bad)':'var(--good)')+'">'+r.status+'</span></td>'
          +'<td><span style="color:'+o[1]+';font-weight:700;font-size:10.5px">'+o[0]+'</span>'
          +(r.attempts>1?' <span style="color:var(--text-3);font-size:10px">'+r.attempts+' attempts</span>':'')+'</td>'
          +'<td>'+(r.step||'\u2014')+'</td><td class="n" style="color:var(--text-3)">'+(r.ts||'')+'</td></tr>';
      });
      out+='</table>';
    }
    if(today.cmes_note) out+='<div class="note">'+today.cmes_note+'</div>';
  } else {
    out+='<div class="lbl">Today</div><div class="empty">No units from '+SEL
      +' today. Configured testers: '+(cfg[SEL]||[]).join(', ')+'.</div>';
  }

  // ---- history ----
  if(Hh&&(Hh.weeks||[]).length){
    const W=Hh.weeks, mx=Math.max.apply(null,W.map(w=>w.att).concat([1]));
    out+='<div class="lbl">'+W.length+' week(s) of history'
      +(Hh.change!=null?' \u00b7 <span style="color:'+(Hh.change>=0?'var(--good)':'var(--bad)')
        +'">'+(Hh.change>=0?'\u25b2':'\u25bc')+' '+Math.abs(Hh.change).toFixed(2)
        +' pts first week to last</span>':'')+'</div>';
    // Bar height is YIELD, not volume. A ramp page exists to show the climb,
    // and heights driven by volume hid a 51-point improvement behind five
    // equally red bars. Volume stays in the tooltip.
    const lo=Math.min.apply(null,W.map(w=>w.fpy==null?100:w.fpy));
    const base=Math.max(0,Math.floor((lo-6)/10)*10);
    out+='<div class="wk">'+W.map(function(w){
        const h=w.fpy==null?3:Math.max(4,Math.round((w.fpy-base)/(100-base)*100));
        return '<div style="height:'+h+'%;background:'+col(w.fpy,floor)+'" title="'
          +w.week+' \u2014 '+w.fp+'/'+w.att+' units ('
          +(w.fpy==null?'-':w.fpy.toFixed(1)+'%')+')"></div>';
      }).join('')+'</div>'
      +'<div class="wkl">'+W.map(w=>'<div>'+w.week.slice(5)+'<br>'
        +(w.fpy==null?'\u2014':w.fpy.toFixed(0)+'%')+'</div>').join('')+'</div>'
      +'<div style="font-size:10px;color:var(--text-3);margin-top:3px">'
      +'bar height = first-pass yield from '+base+'% \u00b7 hover for units</div>';

    out+='<table style="margin-top:12px">'
      +'<colgroup><col style="width:110px"><col style="width:92px"><col style="width:92px">'
      +'<col style="width:92px"><col style="width:96px"><col></colgroup>'
      +'<tr><th>Week</th><th class="n">Tested</th><th class="n">Pass</th>'
      +'<th class="n">Fail</th><th class="n">FPY</th><th>Days</th></tr>';
    W.forEach(function(w){
      out+='<tr><td>'+w.week+'</td><td class="n">'+w.att.toLocaleString()+'</td>'
        +'<td class="n" style="color:var(--good)">'+w.fp.toLocaleString()+'</td>'
        +'<td class="n" style="color:var(--bad)">'+w.fails.toLocaleString()+'</td>'
        +'<td class="n" style="color:'+col(w.fpy,floor)+';font-weight:700">'
        +(w.fpy==null?'\u2014':w.fpy.toFixed(2)+'%')+'</td>'
        +'<td style="color:var(--text-3)">'+w.days+' day(s) \u00b7 '+w.first.slice(4)+'\u2013'+w.last.slice(4)+'</td></tr>';
    });
    out+='<tr class="tot"><td>All '+W.length+' week(s)</td>'
      +'<td class="n">'+Hh.att.toLocaleString()+'</td>'
      +'<td class="n" style="color:var(--good)">'+Hh.fp.toLocaleString()+'</td>'
      +'<td class="n" style="color:var(--bad)">'+Hh.fails.toLocaleString()+'</td>'
      +'<td class="n">'+(Hh.fpy==null?'\u2014':Hh.fpy.toFixed(2)+'%')+'</td><td></td></tr></table>';

    // Day-by-day. The week chart shows the arc; this is the row someone asks
    // for when they want to know what happened on a specific date.
    const DD=(Hh.days||[]);
    if(DD.length){
      out+='<div class="lbl">Day by day</div><table>'
        +'<colgroup><col style="width:112px"><col style="width:88px"><col style="width:88px">'
        +'<col style="width:88px"><col style="width:92px"><col></colgroup>'
        +'<tr><th>Day</th><th class="n">Tested</th><th class="n">Pass</th>'
        +'<th class="n">Fail</th><th class="n">FPY</th><th>By type / top failure</th></tr>';
      DD.slice().reverse().forEach(function(r){
        const d=String(r.day);
        const lbl=d.length===8?(d.slice(4,6)+'/'+d.slice(6,8)+' '+d.slice(0,4)):d;
        let extra='';
        if(r.by_variant){
          extra=Object.keys(r.by_variant).map(function(v){
            const b=r.by_variant[v];
            return '<span class="vr vr-'+v+'">'+v+'</span> '+b.first_pass+'/'+b.input;
          }).join(' &nbsp; ');
        }
        if(!extra&&r.symptoms){
          const k=Object.keys(r.symptoms)[0];
          if(k) extra='<span style="color:var(--text-2)">'+k+' ('+r.symptoms[k]+')</span>';
        }
        out+='<tr><td>'+lbl+'</td><td class="n">'+r.att.toLocaleString()+'</td>'
          +'<td class="n" style="color:var(--good)">'+r.fp.toLocaleString()+'</td>'
          +'<td class="n" style="color:var(--bad)">'+r.fails.toLocaleString()+'</td>'
          +'<td class="n" style="color:'+col(r.fpy,floor)+';font-weight:700">'
          +(r.fpy==null?'\u2014':r.fpy.toFixed(2)+'%')+'</td>'
          +'<td style="font-size:11px">'+extra+'</td></tr>';
      });
      out+='</table>';
    }

    const T=Object.values(Hh.testers||{});
    if(T.length){
      out+='<div class="lbl">By tester \u00b7 whole window</div><table>'
        +'<colgroup><col><col style="width:92px"><col style="width:92px">'
        +'<col style="width:92px"><col style="width:96px"><col style="width:92px"></colgroup>'
        +'<tr><th>Tester</th><th class="n">Tested</th><th class="n">Pass</th>'
        +'<th class="n">Fail</th><th class="n">FPY</th><th class="n">Active</th></tr>';
      T.sort((a,b)=>b.att-a.att).forEach(function(t){
        out+='<tr><td><b>'+t.station+'</b></td><td class="n">'+t.att.toLocaleString()+'</td>'
          +'<td class="n" style="color:var(--good)">'+t.fp.toLocaleString()+'</td>'
          +'<td class="n" style="color:var(--bad)">'+t.fails.toLocaleString()+'</td>'
          +'<td class="n" style="color:'+col(t.fpy,floor)+';font-weight:700">'
          +(t.fpy==null?'\u2014':t.fpy.toFixed(2)+'%')+'</td>'
          +'<td class="n" style="color:var(--text-3)">'+t.days+' day(s)</td></tr>';
      });
      out+='</table>';
    }
  } else {
    out+='<div class="lbl">History</div><div class="empty">No history yet for '+SEL
      +'. It builds from the daily DPR exports as they arrive.</div>';
  }

  document.getElementById('body').innerHTML=out;
  document.getElementById('foot').innerHTML=
    'Judge an NPI build on DIRECTION, not level \u2014 low yield early in a ramp is '
    +'expected, a flat or falling trend is not. First attempt per serial; golden '
    +'samples excluded from every count. Week history comes from the daily DPR '
    +'exports'+(D.history_source?' ('+D.history_source+')':'')+'. Full serials are shown '
    +'so a board can be pulled off the rack. NA = part 800-00383, INT = 800-00384. '
    +'Same data and the same rules as the NPI tab in the hourly dashboard.';
}
render();
</script></body></html>
