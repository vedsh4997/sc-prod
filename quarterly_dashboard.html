<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quarterly Production Report</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--surface:#fff;--line:#e3e9f0;--line2:#cfd8e3;--text:#0f1b2d;--text2:#4a5a6e;
--text3:#8494a7;--good:#17a34a;--warn:#e8a33d;--bad:#e5484d;--accent:#2f6feb;
--mono:"IBM Plex Mono",monospace;--font:"Inter",system-ui,sans-serif;
--shadow:0 1px 2px rgba(16,32,56,.05),0 8px 24px rgba(16,32,56,.06)}
[data-theme="dark"]{--bg:#0d131c;--surface:#141d29;--line:#1f2b3a;--line2:#2c3b4e;
--text:#e8eef6;--text2:#9fb0c4;--text3:#6b7d94;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:24px clamp(14px,3vw,34px) 60px}
.wrap{max-width:1360px;margin:0 auto}
.top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(20px,2.3vw,27px);font-weight:800;margin:3px 0 4px;letter-spacing:-.02em}
.sub{color:var(--text2);font-size:12.5px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 12px;border-radius:8px;
border:1px solid var(--line2);background:var(--surface);color:var(--text2);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:8px 15px;border-radius:9px;
border:1px solid var(--line2);background:var(--surface);color:var(--text2);cursor:pointer;
display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{border-color:var(--text3);transform:translateY(-1px)}
.tab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tab .sm{font-size:9px;font-weight:400;color:var(--text3)}
.tab.on{color:#fff;border-color:transparent}
.tab.on .sm{color:rgba(255,255,255,.78)}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mtab{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:7px;
border:1px solid var(--line2);background:var(--surface);color:var(--text2);cursor:pointer;
display:flex;align-items:center;gap:6px}
.mtab i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mtab.on{border-color:currentColor}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:12px;
padding:15px 17px;margin-top:16px;box-shadow:var(--shadow)}
.lv-h{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.lv-t{font-size:14px;font-weight:800;letter-spacing:-.01em}
.lv-b{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 8px;
border-radius:6px;background:var(--accent);color:#fff}
.lv-s{color:var(--text2);font-size:11.5px;margin-bottom:11px}
.lv-g{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:980px){.lv-g{grid-template-columns:1fr}}
.lv-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-bottom:12px}
.lv-kc{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.lv-kv{font-size:19px;font-weight:800;line-height:1.15}
.lv-kl{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;
letter-spacing:.09em;margin-top:3px}
.vf{margin-top:11px;padding:9px 12px;border-radius:9px;background:rgba(232,163,61,.10);
border-left:3px solid var(--warn);font-size:12px;line-height:1.6;color:var(--text)}
.segb{font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 12px;border:0;
background:var(--surface);color:var(--text2);cursor:pointer;letter-spacing:.06em}
.segb.on{background:var(--accent);color:#fff}
.wkempty{padding:34px 20px;text-align:center;color:var(--text3);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;margin-left:10px}
.seg button{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 12px;border:0;
background:var(--surface);color:var(--text2);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stagesec{margin-bottom:22px}
.stagelbl{font-family:var(--mono);font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.stagedot{width:11px;height:11px;border-radius:3px;display:inline-block}
.stagedesc{font-weight:400;font-size:11px;color:var(--text3)}
@media(max-width:820px){.charts2{grid-template-columns:1fr}}
.chwrap{min-height:280px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.chttl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
color:var(--text2);margin-bottom:6px;text-align:center}
.chleg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px;
font-family:var(--mono);font-size:10px;color:var(--text3)}
.chleg span{display:inline-flex;align-items:center;gap:5px}
.chleg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chleg b{width:9px;height:9px;border-radius:2px;display:inline-block}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin-bottom:16px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.qc-l{font-size:10.5px;color:var(--text3);font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
.qc-q{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:9px;background:#eef2f7;color:#5b6b7f;font-size:10px;font-weight:800;letter-spacing:.04em;vertical-align:middle}
.qc-v{font-family:var(--mono);font-size:22px;font-weight:800;margin-top:5px}
.qc-d{font-family:var(--mono);font-size:10.5px;font-weight:600;margin-top:3px}
.up{color:var(--good)}.dn{color:var(--bad)}.flat{color:var(--text3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px 17px;
box-shadow:var(--shadow);margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.panel-t{font-weight:700;font-size:14px}.panel-s{font-size:11px;color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);font-weight:600}
td.v{font-family:var(--mono);font-weight:600}
.qtag{font-family:var(--mono);font-size:9.5px;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:7px}
tfoot td{font-weight:700;background:rgba(47,111,235,.05)}
.na{color:var(--text3)}
.foot{margin-top:22px;font-family:var(--mono);font-size:10.5px;color:var(--text3);
border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style></head><body><div class="wrap">

// Colour against the product's own target (TARGETS), not fixed cut-offs:
// the old fin cut-off was 99.8, so a 98.00% final pass never went green.
// Compare at the 2dp shown, so a cell reading 98.00% (e.g. 97.996) counts as on target.
function cls(v,kind){if(v==null)return 'flat';
  const t=(TARGETS[curP]||{})[kind]; const r=Math.round(v*100)/100;
  if(t==null){if(kind==='fin')return r>=99.8?'up':r>=99.4?'flat':'dn';return r>=97?'up':r>=94?'flat':'dn';}
  return r>=t?'up':r>=t-3?'flat':'dn';}

function drawCards(){
  const p=P(),box=document.getElementById('qcards');
  box.innerHTML=p.metrics.map(m=>{
    // The two most recent quarters that actually carry data, whichever they
    // are. This used to be pinned to Q2 vs Q1, so the card kept reporting
    // "Q1->Q2" straight through Q3 and would have done the same in Q4.
    const qs=(m.quarters||[]).filter(x=>x && (x.fp!=null||x.fin!=null));
    const cur=qs.length?qs[qs.length-1]:null;
    const prev=qs.length>1?qs[qs.length-2]:null;
    function line(kind,lab){
      const val=cur?cur[kind]:null;let d=null;
      if(prev&&cur&&prev[kind]!=null&&cur[kind]!=null)d=+(cur[kind]-prev[kind]).toFixed(2);
      const dlab=(prev&&cur)?`${prev.q}\u2192${cur.q}`:'';
      const dtxt=d==null?'':`<span class="qc-d ${d>0.05?'up':d<-0.05?'dn':'flat'}">${d>0?'+':''}${d.toFixed(2)} ${dlab}</span>`;
      return `<div class="qc-l" style="margin-top:6px">${lab}</div>
        <div class="qc-v ${cls(val,kind)}" style="font-size:18px">${val==null?'\u2014':val.toFixed(2)+'%'}</div>${dtxt}`;
    }
    const qtag=cur?`<span class="qc-q">${cur.q}</span>`:'';
    return `<div class="qc"><div class="qc-l" style="color:${m.color};font-weight:700">${m.stage}${qtag}</div>
      ${line('fp','First Pass')}${m.has_fin?line('fin','Final Pass'):''}</div>`;
  }).join('');
}
function oneChart(p,m,kind){
  const ms=m.months.map(r=>({mon:r.month,q:r.q,v:r[kind],partial:r.partial}));
  const idx=ms.map((r,i)=>({...r,i})).filter(r=>r.v!=null);
  const title=(kind==='fp'?'First Pass Yield':'Final Pass Yield');
  if(!idx.length) return `<div class="chwrap"><div class="chttl">${title}</div>
    <div class="na" style="padding:40px;text-align:center">No data</div></div>`;
  const W=520,H=260,padL=44,padR=14,padT=16,padB=40;
  // The target has to be inside the y-range or the line lands off the chart.
  const TGT=(TARGETS[p.key]||{})[kind];
  const vals=idx.map(r=>r.v).concat(TGT!=null?[TGT]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max(0.6,(hi-lo)*0.3);lo=Math.max(0,lo-pad);hi=Math.min(100.4,hi+pad);
  if(hi-lo<2){lo=Math.max(0,lo-1);hi=Math.min(100.4,hi+1);}
  const rawStep=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(rawStep)));let step=5*mag;
  for(const s of[0.5,1,2,2.5,5]){if(rawStep<=s*mag){step=s*mag;break;}}
  lo=Math.floor(lo/step)*step;hi=Math.min(100+step*0.4,Math.ceil(hi/step)*step);
  const plotW=W-padL-padR,plotH=H-padT-padB,n=ms.length,slot=plotW/n,bw=Math.min(40,slot*0.5);
  const cx=i=>padL+slot*i+slot/2,y=v=>padT+plotH*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=lo;v<=hi+step*0.01;v+=step){const yy=y(v);const lab=step>=1?v.toFixed(0):v.toFixed(1);
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/>
    <text x="${padL-7}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="var(--text3)" font-family="var(--mono)">${lab}</text>`;}
  for(let i=1;i<n;i++)if(ms[i].q!==ms[i-1].q){const xm=padL+slot*i;
    g+=`<line x1="${xm}" y1="${padT}" x2="${xm}" y2="${padT+plotH}" stroke="var(--line2)" stroke-dasharray="3 3"/>`;}
  // TARGET LINE. A chart that auto-scales to its own data makes any month
  // look reasonable; the target is what says whether it actually was.
  if(TGT!=null && TGT>=lo && TGT<=hi){
    const ty=y(TGT);
    g+=`<line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" stroke="#0ea5e9"
         stroke-width="1.8" stroke-dasharray="6 4" opacity=".9"/>
        <rect x="${W-padR-52}" y="${ty-15}" width="50" height="13" rx="3" fill="#0ea5e9" opacity=".92"/>
        <text x="${W-padR-27}" y="${ty-5}" text-anchor="middle" font-size="8.5"
         font-weight="700" fill="#fff" font-family="var(--mono)">TGT ${TGT.toFixed(0)}%</text>`;
  }
  ms.forEach((r,i)=>{
    if(r.v==null){g+=`<text x="${cx(i)}" y="${padT+plotH+15}" text-anchor="middle" font-size="9" fill="var(--text3)">${r.mon}</text>`;return;}
    const yy=y(r.v),h=padT+plotH-yy;
    const miss=(TGT!=null && r.v<TGT);
    g+=`<rect x="${cx(i)-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="3"
      fill="${miss?'#e5484d':m.color}" opacity="${miss?'.55':'.82'}">
      <animate attributeName="y" from="${padT+plotH}" to="${yy}" dur=".5s" begin="${i*50}ms" fill="freeze"/>
      <animate attributeName="height" from="0" to="${h}" dur=".5s" begin="${i*50}ms" fill="freeze"/>
      <title>${p.name} ${r.mon} ${m.stage} ${title}: ${r.v.toFixed(2)}%${
        TGT!=null?`\ntarget ${TGT.toFixed(1)}% \u2014 ${
          (r.v-TGT>=0?'+':'')+(r.v-TGT).toFixed(2)} pts`:''}</title></rect>
      <text x="${cx(i)}" y="${yy-5}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text2)" font-family="var(--mono)">${r.v.toFixed(1)}</text>
      <text x="${cx(i)}" y="${padT+plotH+15}" text-anchor="middle" font-size="9" fill="var(--text3)">${r.mon}</text>`;});
  // The trend must BREAK where months are missing. One polyline over the
  // non-null months drew a straight line from Jun to Oct, through July,
  // August and September -- months with no data at all. That reads as four
  // months of smooth decline that never happened.
  const tcol='#e5484d';
  const runs=[]; let cur=[];
  idx.forEach((r,k)=>{
    if(k>0 && r.i !== idx[k-1].i+1){ if(cur.length) runs.push(cur); cur=[]; }
    cur.push(r);
  });
  if(cur.length) runs.push(cur);
  runs.forEach(run=>{
    if(run.length<2) return;
    const pts=run.map(r=>`${cx(r.i)},${y(r.v)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${tcol}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
  });
  idx.forEach(r=>{g+=`<circle cx="${cx(r.i)}" cy="${y(r.v)}" r="3.2" fill="${tcol}"/>`;});
  return `<div class="chwrap"><div class="chttl">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>
    <div class="chleg"><span><b style="background:${m.color};opacity:.82"></b>${m.stage} monthly</span>
      <span><i style="background:${tcol}"></i>trend</span>
      ${TGT!=null?`<span><i style="background:#0ea5e9"></i>target ${TGT.toFixed(0)}%</span>`:''}
      </div></div>`;
}

// Weekly first-pass yield for one stage. Same visual language as the monthly
// chart — bars plus a connecting line through the actual points — so switching
// granularity does not mean relearning the chart.
function weekChart(p,m){
  const rows=(m.weeks||[]).filter(r=>r.v!=null);
  if(rows.length<2) return `<div class="chwrap"><div class="chttl">First Pass Yield — weekly</div>

  const W=520,H=260,padL=44,padR=14,padT=16,padB=40;
  const vals=rows.map(r=>r.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max(0.6,(hi-lo)*0.3); lo=Math.max(0,lo-pad); hi=Math.min(100.4,hi+pad);
  if(hi-lo<2){lo=Math.max(0,lo-1);hi=Math.min(100.4,hi+1);}
  const rawStep=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(rawStep)));let step=5*mag;
  for(const sx of[0.5,1,2,2.5,5]){if(rawStep<=sx*mag){step=sx*mag;break;}}
  lo=Math.floor(lo/step)*step; hi=Math.min(100+step*0.4,Math.ceil(hi/step)*step);
  const plotW=W-padL-padR,plotH=H-padT-padB,n=rows.length,slot=plotW/n;
  const bw=Math.min(34,slot*0.5);
  const cx=i=>padL+slot*i+slot/2, y=v=>padT+plotH*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=lo;v<=hi+step*0.01;v+=step){const yy=y(v);
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/>
    <text x="${padL-7}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="var(--text3)"
    font-family="var(--mono)">${step>=1?v.toFixed(0):v.toFixed(1)}</text>`;}
  rows.forEach((r,i)=>{
    const yy=y(r.v),h=padT+plotH-yy;
    g+=`<rect x="${cx(i)-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="3"
      fill="${m.color}" opacity=".82"><title>${p.name} W${r.week} ${m.stage}: ${r.v.toFixed(2)}%
      (${r.units.toLocaleString()} units)</title></rect>
      <text x="${cx(i)}" y="${yy-5}" text-anchor="middle" font-size="8.5" font-weight="700"

      <text x="${cx(i)}" y="${padT+plotH+15}" text-anchor="middle" font-size="9"
        fill="var(--text3)">W${r.week}</text>`;});
  const pts=rows.map((r,i)=>`${cx(i)},${y(r.v)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="#e5484d" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
  rows.forEach((r,i)=>{g+=`<circle cx="${cx(i)}" cy="${y(r.v)}" r="3.2" fill="#e5484d"/>`;});
  return `<div class="chwrap"><div class="chttl">First Pass Yield — weekly</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
}

function drawTable(){

      <table><thead><tr><th>Stage</th>${p.metrics[0].months.map(r=>'<th>'+r.month+'</th>').join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  host.innerHTML=block('fp','First Pass Yield')+block('fin','Final Pass Yield');
}
// --------------------------------------------------------------------------
// LIVE SECTIONS — Pareto + weekly trend, both filtered to the selected product
// --------------------------------------------------------------------------
function svgPareto(rows,id,w,h,accent){
  if(!rows||!rows.length) return '<div class="lv-s">No failures recorded.</div>';
  const cs=getComputedStyle(document.documentElement);
  const gridC=cs.getPropertyValue('--line2').trim()||'#cfd8e3';
  const txtC=cs.getPropertyValue('--text3').trim()||'#8494a7';
  const labC=cs.getPropertyValue('--text').trim()||'#0f1b2d';
  const L=48,R=74,T=22,Bm=84,pw=w-L-R,ph=h-T-Bm;
  const n=rows.length,mx=Math.max(...rows.map(r=>r.fails))||1,slot=pw/n;
  const bw=Math.min(slot*0.58,40);
  let bars='',pts=[],labs='';
  rows.forEach((r,i)=>{
    const cx=L+slot*(i+0.5),bh=(r.fails/mx)*ph,y=T+ph-bh;
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${bh.toFixed(1)}" rx="3" fill="${accent}" opacity=".85"/>
      <text x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="10" fill="${labC}"
      text-anchor="middle">${r.fails}</text>`;
    pts.push([cx,T+ph-(r.cum/100)*ph]);
    labs+=`<text x="${cx.toFixed(1)}" y="${(T+ph+12).toFixed(1)}" font-size="9" fill="${txtC}"
      text-anchor="end" transform="rotate(-38 ${cx.toFixed(1)} ${(T+ph+12).toFixed(1)})"
      >${String(r.reason).slice(0,17)}</text>`;
  });
  const grid=[25,50,75,100].map(g=>{const gy=T+ph-(g/100)*ph;
    return `<line x1="${L}" y1="${gy.toFixed(1)}" x2="${L+pw}" y2="${gy.toFixed(1)}"
      stroke="${gridC}" stroke-width="1" opacity=".45"/>
      <text x="${L+pw+8}" y="${(gy+4).toFixed(1)}" font-size="9" fill="${txtC}">${g}%</text>`;
  }).join('');
  const y80=T+ph-0.8*ph;
  return `<svg id="${id}" viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <line x1="${L}" y1="${y80.toFixed(1)}" x2="${L+pw}" y2="${y80.toFixed(1)}"
      stroke="#e5484d" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="${L+pw+8}" y="${(y80-4).toFixed(1)}" font-size="9" fill="#e5484d">80%</text>
    ${bars}
    <polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"
      fill="none" stroke="#e8a33d" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#e8a33d"/>`).join('')}
    <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="${gridC}"/>
    ${labs}</svg>`;
}

// Weekly volume with FPY riding over it on its own scale, so a yield dip shows
// even when volume is flat.
function svgWeekly(rows,id,w,h,accent){
  if(!rows||rows.length<2) return '<div class="lv-s">Not enough weeks yet.</div>';
  const cs=getComputedStyle(document.documentElement);
  const gridC=cs.getPropertyValue('--line2').trim()||'#cfd8e3';
  const txtC=cs.getPropertyValue('--text3').trim()||'#8494a7';
  const L=38,R=44,T=20,Bm=32,pw=w-L-R,ph=h-T-Bm;
  const n=rows.length,mx=Math.max(...rows.map(r=>r.units))||1,slot=pw/n;
  const lo=Math.min(...rows.map(r=>r.fpy))-0.5,hi=Math.max(...rows.map(r=>r.fpy))+0.5;
  const span=Math.max(hi-lo,0.5);
  let bars='',pts=[],labs='';
  rows.forEach((r,i)=>{
    const cx=L+slot*(i+0.5),bh=(r.units/mx)*ph;
    bars+=`<rect x="${(cx-slot*0.28).toFixed(1)}" y="${(T+ph-bh).toFixed(1)}"
      width="${(slot*0.56).toFixed(1)}" height="${bh.toFixed(1)}" rx="2"
      fill="${accent}" opacity=".28"/>`;
    pts.push([cx,T+ph-((r.fpy-lo)/span)*ph]);
    labs+=`<text x="${cx.toFixed(1)}" y="${(T+ph+13).toFixed(1)}" font-size="9"
      fill="${txtC}" text-anchor="middle">W${r.week}</text>`;
  });
  return `<svg id="${id}" viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg">
    ${bars}
    <polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"
      fill="none" stroke="#17a34a" stroke-width="2.2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2"
      fill="#17a34a"><title>W${rows[i].week}: ${rows[i].units} units, FPY ${rows[i].fpy}%</title></circle>`).join('')}
    <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="${gridC}"/>
    <text x="${L}" y="${T-6}" font-size="9" fill="${txtC}">bars = units</text>
    <text x="${L+pw}" y="${T-6}" font-size="9" fill="#17a34a" text-anchor="end">line = FPY</text>
    ${labs}</svg>`;
}

function dlSVG(id,name){
  const el=document.getElementById(id); if(!el) return;
  const b=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+
    new XMLSerializer().serializeToString(el)],{type:'image/svg+xml;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=name+'.svg';a.click();URL.revokeObjectURL(a.href);
}
function dlPNG(id,name){
  const el=document.getElementById(id); if(!el) return;
  const vb=el.getAttribute('viewBox').split(/\s+/).map(Number),sc=2;
  const bgc=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#fff';
  const src=new XMLSerializer().serializeToString(el),img=new Image();
  img.onload=function(){
    const c=document.createElement('canvas');c.width=vb[2]*sc;c.height=vb[3]*sc;
    const x=c.getContext('2d');x.fillStyle=bgc;x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(bl){const a=document.createElement('a');
      a.href=URL.createObjectURL(bl);a.download=name+'.png';a.click();URL.revokeObjectURL(a.href);});
  };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(src)));
}

function drawLive(){
  const p=P(),host=document.getElementById('live');
  if(!host) return;
  const lv=p.live;
  if(!lv){ host.innerHTML=''; return; }
  const par=lv.pareto||[];
  let cut=0;
  for(let i=0;i<par.length;i++){ if(par[i].cum>=80){ cut=i+1; break; } }
  const vf=cut?`<div class="vf"><b>${cut} of ${par.length}</b> failing step${cut>1?'s':''}
    cause 80% of ${p.name} failures: <b>${par.slice(0,cut).map(r=>r.reason).join(', ')}</b>.
    Fixing these is worth more than everything else on this chart combined.</div>`:'';
  const nm=(p.key+'_'+(lv.label||'')).replace(/[^A-Za-z0-9]+/g,'_');

  host.innerHTML=`<div class="lv">
    <div class="lv-h"><span class="lv-t">${p.name} \u2014 live from the weekly archive</span>
      <span class="lv-b">${lv.label||''}</span>
      <span style="margin-left:auto">
        <button class="btn" onclick="dlPNG('lvPar','${nm}_pareto')">PNG</button>
        <button class="btn" onclick="dlSVG('lvPar','${nm}_pareto')">SVG</button></span></div>
    <div class="lv-s">${lv.period||''} \u2014 computed from the WPR exports, not transcribed.</div>
    <div class="lv-k">
      <div class="lv-kc"><div class="lv-kv">${(lv.units||0).toLocaleString()}</div>
        <div class="lv-kl">Units</div></div>
      <div class="lv-kc"><div class="lv-kv" style="color:${lv.fpy>=97?'var(--good)':(lv.fpy>=93?'var(--warn)':'var(--bad)')}">
        ${lv.fpy!=null?lv.fpy.toFixed(2)+'%':'\u2014'}</div><div class="lv-kl">First pass</div></div>
      <div class="lv-kc"><div class="lv-kv">${(lv.fails||0).toLocaleString()}</div>
        <div class="lv-kl">Failures</div></div>
      <div class="lv-kc"><div class="lv-kv">${(lv.weekly||[]).length}</div>
        <div class="lv-kl">Weeks</div></div>
    </div>
    <div class="lv-g">
      <div><div class="lv-s" style="font-weight:700;color:var(--text)">Failure Pareto</div>
        ${svgPareto(par,'lvPar',720,340,p.color)}${vf}</div>
      <div><div class="lv-s" style="font-weight:700;color:var(--text)">Weekly trend</div>
        ${svgWeekly(lv.weekly,'lvWk',480,300,p.color)}</div>
    </div></div>`;
}

function render(){drawTabs();drawCards();drawChart();drawTable();drawLive();}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('sc_theme',t);}catch(e){}
  // charts read CSS variables at draw time, so they must be redrawn on flip
  try{ if(document.getElementById('live')) drawLive(); }catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
try{const s=localStorage.getItem('sc_theme');applyTheme(s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){applyTheme('light');}
render();
</script>
