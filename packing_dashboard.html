body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;

.wrap{max-width:1300px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
h1{font-family:var(--sans);font-size:26px;margin:4px 0 2px}
.sub{font-family:var(--sans);color:var(--fg2);font-size:13px;margin:0 0 6px}
.sub b{color:var(--fg)}
.warn{font-family:var(--sans);font-size:12.5px;border-left:3px solid var(--bad);background:var(--card);padding:8px 12px;margin:8px 0}
.thm{font:600 12px var(--mono);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--fg2);cursor:pointer}
.sec{font-weight:700;font-size:11.5px;letter-spacing:.06em;color:var(--fg2);text-transform:uppercase;margin:20px 0 8px}
.sec span{font-weight:400;color:var(--fg3);text-transform:none;letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:11px 13px;min-width:0}
.c.tot{border:1.5px solid var(--acc)}
.c .ln{font-weight:700}.c .pr{font-size:10.5px;color:var(--fg3);margin-left:4px}
.c .v{font-size:26px;font-weight:700;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.c.tot .v{color:var(--acc)}
.c .k{font-size:9.5px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}
.c .s{font-size:11px;color:var(--fg2);margin-top:6px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:7px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--gridc);text-align:right;white-space:nowrap}
th{font-size:10px;letter-spacing:.08em;color:var(--fg3);font-weight:500;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
td:first-child b{display:block}td:first-child small{color:var(--fg3);font-size:10.5px}
td .o{font-size:15px;font-weight:700;display:block}
td.z .o{font-weight:400}
td .m{font-size:10px;color:var(--fg3)} td .m .f{color:var(--bad)}
td.now{outline:1.5px dashed var(--acc);outline-offset:-3px}
td.z{color:var(--fg3)}
td.tot,th.tot{border-left:1px solid var(--bd)}
tr.fl td{font-weight:700;border-top:2px solid var(--bd)}
.note{font-family:var(--sans);font-size:12px;color:var(--fg2);margin-top:12px;line-height:1.55}
.note code{font-family:var(--mono)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 2px;align-items:center}
.tabs button{font:600 12.5px var(--mono);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 14px;color:var(--fg2);cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs .ar{color:var(--fg3)}
.c .fw{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.c .fw b{color:var(--fg);font-weight:600}.c .fw b.sel{color:var(--acc)}

  +'<td class="tot"><span class="o">'+floor.toLocaleString()+'</span></td></tr></tbody>';
 document.getElementById('grid').innerHTML=H.length?g:'<tbody><tr><td>No '+esc(LAB)+' data yet today.</td></tr></tbody>';
 const HI=GG.history||[];
 let t='<thead><tr><th>Line</th>'+HI.map(x=>'<th>'+dd(x.day).slice(5)+'</th>').join('')+'</tr></thead><tbody>';
 L.forEach(l=>{t+='<tr><td><b>'+esc(l)+'</b></td>'+HI.map(x=>'<td>'+((x.lines||{})[l]||0).toLocaleString()+'</td>').join('')+'</tr>';});
 document.getElementById('hist').innerHTML=t+'</tbody>';
 const opl=ORD.map(g=>{const o=[...new Set(Object.values((GR[g]||{}).ops||{}).flatMap(x=>Object.keys(x)))].sort();
   return esc((GR[g]||{}).label||g)+': <code>'+(o.length?esc(o.join(', ')):'none found yet')+'</code>';}).join(' &middot; ');
 document.getElementById('note').innerHTML='Cells = OUT for the hour (hover for in / pass / fail). Dashed cell = hour still filling. '
  +'Card flow line = PCB VI &rarr; Final VI &rarr; Pack2Box OUT for that line. CMES operations counted &mdash; '+opl+'. '
  +'Line 6.5 is IQ10B (EP5000 / EP5001) moved from whichever CMES line it is booked on.';
}
draw();
