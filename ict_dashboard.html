<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT — Yield & Failure by Line</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
 --bg:#05080f; --surface:#0a1120; --surface2:#0f1828; --border:#1a2942; --border2:#25395a;
 --t0:#eaf2ff; --t1:#c5d6ee; --t2:#8499b8; --t3:#51637e;
 --ict:#a06bff; --good:#2bffb0; --warn:#ffc23a; --bad:#ff5470;
 --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
 --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh;
 background-image:radial-gradient(1000px 520px at 88% -12%,rgba(160,107,255,.10),transparent 60%),
   radial-gradient(820px 460px at -8% 6%,rgba(46,139,255,.07),transparent 58%);}
.wrap{max-width:1320px;margin:0 auto;padding:22px 26px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
 border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:20px}
.h-title{font-size:20px;font-weight:800;color:var(--t0);letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.h-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}
.h-sub{font-family:var(--mono);font-size:11px;color:var(--t2);margin-top:5px}
.h-sub b{color:var(--t1)}
.btn{background:linear-gradient(135deg,var(--ict),#6d28d9);color:#fff;border:none;border-radius:9px;
 padding:9px 15px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.btn:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--t1)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--ict);
 border-radius:14px;padding:15px 16px;cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(124,58,237,.18);border-color:var(--ict)}
.card.nofail{border-top-color:var(--border2);cursor:default;opacity:.92}
.card.nofail:hover{transform:none;box-shadow:none;border-color:var(--border)}
.lc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.lc-name{font-family:var(--mono);font-size:17px;font-weight:800;color:var(--t0)}
.lc-prod{font-size:11px;color:var(--t2);font-family:var(--mono)}
.sc-green{color:var(--good)} .sc-amber{color:var(--warn)} .sc-red{color:var(--bad)}
.op-empty{font-size:11px;color:var(--t3);padding:5px 2px;font-family:var(--mono)}
.sec{margin-top:2px}
.sec-row{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;color:var(--t2);
 letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:8px 0 6px;user-select:none}
.sec-row:hover{color:var(--t1)}
.sec-caret{display:inline-block;font-size:9px;color:var(--ict);transition:transform .15s}
.sec.open .sec-caret{transform:rotate(90deg)}
.sec-n{color:var(--t3);font-weight:700}
.sec-body{display:none}
.sec.open .sec-body{display:block}
table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.st th{color:var(--t3);text-align:left;font-weight:600;font-size:9px;letter-spacing:.03em;
 padding:2px 5px 5px;border-bottom:1px solid var(--border);text-transform:uppercase}
table.st td{padding:5px 5px;border-bottom:1px solid var(--border);color:var(--t1)}
table.st tbody tr:last-child td{border-bottom:none}
table.st .r{text-align:right;font-variant-numeric:tabular-nums}
.lc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;
 border-top:1px solid var(--border)}
.lc-fails{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--bad)}
.lc-fails.zero{color:var(--good)}
.lc-arrow{font-size:11px;color:var(--ict);font-weight:700}
.nofail .lc-arrow{color:var(--t3);font-weight:500}

/* drill view */
.drill{display:none}
.drill.on{display:block}
.grid.hide{display:none}
.d-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.d-title{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--t0)}
.d-meta{font-family:var(--mono);font-size:12px;color:var(--t2)}
.d-meta b{color:var(--bad)}
.sec-h{font-size:12px;letter-spacing:.06em;color:var(--t2);text-transform:uppercase;font-weight:800;
 margin:6px 0 12px;display:flex;align-items:center;gap:10px}
.sec-h .pill{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ict);
 background:rgba(160,107,255,.13);border:1px solid rgba(160,107,255,.3);border-radius:6px;padding:2px 8px;letter-spacing:.04em}

.tp-block{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:9px;overflow:hidden}
.tp-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.tp-row:hover{background:var(--surface2)}
.tp-name{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--t0)}
.tp-track{height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.tp-fill{height:100%;border-radius:6px}
.tp-vital .tp-fill{background:linear-gradient(90deg,var(--bad),#ff8da3)}
.tp-trivial .tp-fill{background:var(--border2)}
.tp-trivial .tp-name{color:var(--t2)}
.tp-val{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--t1);white-space:nowrap}
.tp-caret{font-size:11px;color:var(--t3);margin-left:6px}
.tp-syms{display:none;padding:0 15px 13px 135px;background:var(--surface)}
.tp-block.open .tp-syms{display:block}
.tp-block.open .tp-caret{transform:rotate(90deg)}
.sym-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
.sym-row:last-child{border-bottom:none}
.sym-name{font-size:12px;color:var(--t1)}
.sym-bar{height:8px;width:90px;background:var(--bg);border-radius:4px;overflow:hidden}
.sym-bar i{display:block;height:100%;background:var(--ict);border-radius:4px}
.sym-cnt{font-family:var(--mono);font-size:12px;color:var(--t2);white-space:nowrap}

.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:auto;max-height:460px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--surface2);color:var(--t2);text-align:left;padding:9px 12px;
 font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono)}
tr:hover td{background:var(--surface2)}
.empty{padding:40px;text-align:center;color:var(--t3);font-size:13px;
 background:var(--surface);border:1px dashed var(--border);border-radius:12px}
.note{font-size:12px;color:var(--t2);margin-bottom:14px}
</style></head>

function lineLabel(raw){ const m=(raw+'').match(/PRDLN-?0*(\d+)/i); return m?('Line '+m[1].padStart(2,'0')):raw; }
function testerOf(eq){ const m=(eq+'').match(/ICT\s*\d+/i); return m?m[0].replace(/\s+/g,'').toUpperCase():((eq+'').split('.').pop()||'ICT'); }
function symOf(f){ return ((f.symptom_name||f.test||f.symptom_message||'Unknown')+'').trim(); }
function fpyCls(y){ return y>=97?'sc-green':y>=95?'sc-amber':'sc-red'; }
function lineFails(L){ return (L.ICT_FAILS||[]).reduce((s,st)=>s+((st.fails||[]).length),0); }
function allFails(L){ const a=[]; (L.ICT_FAILS||[]).forEach(st=>(st.fails||[]).forEach(f=>a.push(f))); return a; }

function init(){
  document.getElementById('hFetch').textContent = ICT.fetched ? (ICT.fetched+'').replace('T',' ') : 'no data';
  document.getElementById('hHours').textContent = (ICT.from_hour!=null) ? (ICT.from_hour+'–'+ICT.to_hour) : '—';
  renderLines();
}

function renderLines(){
  const el=document.getElementById('lineGrid');
  const lines=(ICT&&ICT.lines)||{};
  const keys=Object.keys(lines);
  if(!keys.length){ el.innerHTML='<div class="empty">No ICT data yet. Run <b>Refresh ICT</b> / <span style="font-family:var(--mono)">python run_ict.py</span> to pull from CMES.</div>'; return; }
  // sort: lines with most fails first, then by name
  keys.sort((a,b)=> lineFails(lines[b])-lineFails(lines[a]) || a.localeCompare(b));
  el.innerHTML = keys.map(k=>card(k,lines[k])).join('');
}

function fmt(n){ n=+n||0; return n.toLocaleString(); }
function stationTable(rows){
  if(!rows||!rows.length) return '<div class="op-empty">none reported</div>';
  const body=rows.map(r=>{ const y=+r.fpy||0; return `<tr>
      <td>${r.product||''}</td>
      <td>${r.operation||''}</td>
      <td class="r">${fmt(r.input_qty)}</td>
      <td class="r">${fmt(r.first_pass)}</td>
      <td class="r">${fmt(r.first_fail)}</td>
      <td class="r ${fpyCls(y)}">${y?y.toFixed(1)+'%':'—'}</td></tr>`; }).join('');
  return `<table class="st">
    <thead><tr><th>Product</th><th>Station</th><th class="r">In</th><th class="r">Pass</th><th class="r">Fail</th><th class="r">FPY</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}
function card(lname,L){
  const ict=L.ICT||[], lh=L.LH||[];
  const firstFails = ict.reduce((s,r)=>s+(+r.first_fail||0),0);
  const popupFails = lineFails(L);            // per-unit tester detail (from FIRST-FAIL popup)
  const drillable  = popupFails>0;
  const footHint = drillable ? 'drill by tester →'
                 : (firstFails ? 'tester detail n/a' : 'clean — no fails');
  return `<div class="card ${drillable?'':'nofail'}" ${drillable?`onclick="openLine('${lname}')"`:''}>
    <div class="lc-head">
      <span class="lc-name">${lineLabel(lname)}</span>
      <span class="lc-prod">${lname}</span>
    </div>
    <div class="sec open">
      <div class="sec-row" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">
        <span class="sec-caret">▸</span> ICT stations <span class="sec-n">(${ict.length})</span>
      </div>
      <div class="sec-body">${stationTable(ict)}</div>
    </div>
    <div class="sec">
      <div class="sec-row" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">
        <span class="sec-caret">▸</span> Lead Height stations <span class="sec-n">(${lh.length})</span>
      </div>
      <div class="sec-body">${stationTable(lh)}</div>
    </div>
    <div class="lc-foot">
      <span class="lc-fails ${firstFails?'':'zero'}">${firstFails} ICT fails</span>
      <span class="lc-arrow">${footHint}</span>
    </div>
  </div>`;
}

let _openLine=null;
function openLine(lname){
  _openLine=lname;
  const L=(ICT.lines||{})[lname]||{};
  const fails=allFails(L);
  const total=fails.length;
  // group by tester
  const byT={}; fails.forEach(f=>{ const t=testerOf(f.equipment); (byT[t]=byT[t]||[]).push(f); });
  const testers=Object.entries(byT).sort((a,b)=>b[1].length-a[1].length);
  const top=testers.length?testers[0][1].length:1;
  let cum=0;
  const bars=testers.map(([t,arr])=>{
    const cnt=arr.length, pct=cnt/total*100, vital=cum<80; cum+=pct;
    const w=cnt/top*100;
    const sC={}; arr.forEach(f=>{const k=symOf(f); sC[k]=(sC[k]||0)+1;});
    const syms=Object.entries(sC).sort((a,b)=>b[1]-a[1]);
    const sTop=syms[0]?syms[0][1]:1;
    const symRows=syms.map(([s,c])=>`<div class="sym-row">
        <span class="sym-name">${s}</span>
        <span class="sym-bar"><i style="width:${(c/sTop*100).toFixed(0)}%"></i></span>
        <span class="sym-cnt">${c}</span></div>`).join('');
    return `<div class="tp-block ${vital?'tp-vital':'tp-trivial'}">
      <div class="tp-row" onclick="this.parentElement.classList.toggle('open')">
        <span class="tp-name">${t}</span>
        <span class="tp-track"><span class="tp-fill" style="width:${w.toFixed(1)}%"></span></span>
        <span class="tp-val">${cnt} · ${pct.toFixed(0)}% <span class="tp-caret">▸</span></span>
      </div>
      <div class="tp-syms">${symRows}</div>
    </div>`;
  }).join('');

  const unitRows=fails.map(f=>`<tr>
      <td class="mono">${f.serialnumber||''}</td>
      <td class="mono">${testerOf(f.equipment)}</td>
      <td>${symOf(f)}</td>
      <td class="mono">${f.value||''}</td>
      <td class="mono">${((f.datetime||'')+'').replace(/^\S+\s/,'')}</td>
    </tr>`).join('');

  document.getElementById('drill').innerHTML = `
    <div class="d-top">
      <span class="d-title">${lineLabel(lname)}</span>
      <span class="d-meta"><b>${total}</b> ICT fails · ${testers.length} tester${testers.length!==1?'s':''}</span>
    </div>
    <div class="sec-h">Failures by tester <span class="pill">ICT-WISE</span> <span style="font-weight:500;text-transform:none;color:var(--t3)">· red = the vital few · click a tester for its symptoms</span></div>
    ${bars||'<div class="empty">No fail records captured for this line.</div>'}
    <div class="sec-h" style="margin-top:24px">Failing units · ${total}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Serial Number</th><th>Tester</th><th>Symptom</th><th>Value</th><th>Time</th></tr></thead>
      <tbody>${unitRows||'<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:24px">No units</td></tr>'}</tbody>
    </table></div>`;
  document.getElementById('lineGrid').classList.add('hide');
  document.getElementById('drill').classList.add('on');
  document.getElementById('backBtn').style.display='inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function closeLine(){
  _openLine=null;
  document.getElementById('drill').classList.remove('on');
  document.getElementById('lineGrid').classList.remove('hide');
  document.getElementById('backBtn').style.display='none';
}

function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('Export still loading…');return;}
  const wb=XLSX.utils.book_new();
  const lines=(ICT.lines)||{};
  // ICT yields
  const yr=[['Line','Operation','Product','Input','First Pass','First Fail','FPY%']];
  Object.keys(lines).forEach(k=>(lines[k].ICT||[]).forEach(r=>
    yr.push([lineLabel(k),r.operation||'',r.product||'',r.input_qty||'',r.first_pass||'',r.first_fail||'',r.fpy||''])));
  const ws1=XLSX.utils.aoa_to_sheet(yr); ws1['!cols']=[{wch:9},{wch:12},{wch:10},{wch:8},{wch:10},{wch:10},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws1,'ICT Yields');
  // tester-wise fail counts
  const tr=[['Line','Tester','Symptom','Count']];
  Object.keys(lines).forEach(k=>{
    const byT={}; allFails(lines[k]).forEach(f=>{const t=testerOf(f.equipment); (byT[t]=byT[t]||[]).push(f);});
    Object.entries(byT).forEach(([t,arr])=>{ const sC={}; arr.forEach(f=>{const s=symOf(f); sC[s]=(sC[s]||0)+1;});
      Object.entries(sC).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>tr.push([lineLabel(k),t,s,c])); });
  });
  const ws2=XLSX.utils.aoa_to_sheet(tr); ws2['!cols']=[{wch:9},{wch:10},{wch:34},{wch:7}];
  XLSX.utils.book_append_sheet(wb,ws2,'Fails by Tester');
  // every failing unit
  const ur=[['Line','Tester','Serial Number','Symptom','Value','Time']];
  Object.keys(lines).forEach(k=>allFails(lines[k]).forEach(f=>
    ur.push([lineLabel(k),testerOf(f.equipment),f.serialnumber||'',symOf(f),f.value||'',f.datetime||''])));
  const ws3=XLSX.utils.aoa_to_sheet(ur); ws3['!cols']=[{wch:9},{wch:10},{wch:24},{wch:30},{wch:14},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws3,'Failing Units');
  XLSX.writeFile(wb,`ICT_by_line_${(ICT.fetched||'').slice(0,10)||'export'}.xlsx`);
}

init();
